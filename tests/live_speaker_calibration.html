<!doctype html>
<meta charset="utf-8">
<title>Nova — Speaker Calibration (V3 P5.2)</title>
<style>
  :root { --bg:#0e1116; --fg:#e6e9ef; --dim:#9aa4b2; --ok:#2ea043; --bad:#f85149;
          --warn:#d29922; --line:#232a35; --card:#161b22; }
  body { background:var(--bg); color:var(--fg); font:15px/1.55 system-ui,sans-serif;
         margin:0; padding:28px; max-width:920px; }
  h1 { font-size:20px; margin:0 0 4px; } h2 { font-size:16px; margin:22px 0 8px; }
  .dim { color:var(--dim); } .ok { color:var(--ok); } .bad { color:var(--bad); }
  .warn { color:var(--warn); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:16px; margin:12px 0; }
  button { background:#21262d; color:var(--fg); border:1px solid var(--line);
           border-radius:7px; padding:9px 14px; font-size:14px; cursor:pointer; }
  button:hover:not(:disabled) { border-color:#3d4756; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button.primary { background:#1f6feb; border-color:#1f6feb; }
  button.danger { background:#4a1d1d; border-color:#6e2b2b; }
  input { background:#0d1117; color:var(--fg); border:1px solid var(--line);
          border-radius:6px; padding:8px; font-size:14px; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th,td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); }
  pre { background:#0d1117; border:1px solid var(--line); border-radius:8px;
        padding:12px; overflow:auto; font-size:12px; max-height:340px; }
  .step { opacity:.35; pointer-events:none; }
  .step.active { opacity:1; pointer-events:auto; }
  .step.done { opacity:.7; pointer-events:auto; }
  .rec { background:#4a1d1d; border-color:#6e2b2b; }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px;
          border:1px solid var(--line); font-size:12px; margin-right:6px; }
  .bar { height:6px; background:#0d1117; border-radius:3px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--ok); }
</style>

<h1>Nova speaker calibration</h1>
<p class="dim">
  V3 P5.2 · turns the provisional 0.55 / 0.10 into measured numbers.
  Needs <b>Marcus</b> and <b>one other real person</b>. Nothing here records
  audio to disk — samples are decoded, embedded and discarded.
</p>

<div class="card">
  <label>Backend <input id="base" size="28" value="http://localhost:8008"></label>
  <label style="margin-left:12px">API token <input id="tok" size="20" placeholder="if set"></label>
  <button id="ping">Check</button>
  <div id="pingout" class="dim" style="margin-top:8px"></div>
</div>

<div id="steps"></div>

<script>
// ── tiny helpers ────────────────────────────────────────────────────────────
const $ = (s, r=document) => r.querySelector(s);
const el = (t, c, h) => { const e=document.createElement(t); if(c)e.className=c;
                          if(h!==undefined)e.innerHTML=h; return e; };
const base = () => $("#base").value.replace(/\/$/, "");
const hdrs = () => { const t=$("#tok").value.trim();
                     return t ? {"X-API-Token": t} : {}; };

async function api(path, opts={}) {
  const r = await fetch(base()+path, {...opts, headers:{...hdrs(), ...(opts.headers||{})}});
  const txt = await r.text();
  let body; try { body = JSON.parse(txt); } catch { body = {raw:txt}; }
  if (!r.ok) throw new Error(body?.detail || body?.raw || ("HTTP "+r.status));
  return body;
}

// ── autosave: NON-AUDIO progress only ───────────────────────────────────────
// An accidental refresh must not cost a human twenty utterances. Blobs are
// never persisted — only labels, scores and counts.
const SAVE_KEY = "nova.p52.calibration.v2";
const S = JSON.parse(localStorage.getItem(SAVE_KEY) || "null") || {
  step: 0, marcusId: null, guestId: null, trials: [], validation: [],
  enroll: {}, proposal: null, applied: false, latency: [],
  sentinel: null, permission: null, sttLatency: null, statusAfter: null,
  // ONE conversation for the whole sentinel run. /chat mints a fresh UUID per
  // call when none is sent, so the previous harness put every sentinel turn in
  // its OWN conversation — which tests nothing: of course a brand new
  // conversation cannot see another one's memory. The privacy claim is only
  // meaningful when Marcus, the guest and the unverified speaker share one.
  sentinelConversationId: null,
};
function save() { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); render(); }
function reset() { localStorage.removeItem(SAVE_KEY); location.reload(); }

// ── recording ───────────────────────────────────────────────────────────────
let stream = null;
async function mic() {
  if (!stream) stream = await navigator.mediaDevices.getUserMedia({audio:true});
  return stream;
}
async function record(ms, btn) {
  const s = await mic();
  const mr = new MediaRecorder(s, MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
    ? {mimeType:"audio/webm;codecs=opus"} : undefined);
  const chunks = [];
  mr.ondataavailable = e => e.data.size && chunks.push(e.data);
  const done = new Promise(res => mr.onstop = () => res(new Blob(chunks, {type: mr.mimeType||"audio/webm"})));
  mr.start(200);
  if (btn) btn.classList.add("rec");
  await new Promise(r => setTimeout(r, ms));
  try { mr.stop(); } catch {}
  if (btn) btn.classList.remove("rec");
  return await done;
}

async function identify(blob) {
  const fd = new FormData();
  fd.append("file", blob, "trial.webm");
  const t0 = performance.now();
  const out = await api("/speaker/identify", {method:"POST", body:fd});
  out.round_trip_ms = Math.round(performance.now() - t0);
  // NOT "embed_ms": the server measures the whole identify() call — quality
  // gate, embedding and scoring. Naming it embedding-only would overstate
  // what was measured.
  out.identify_ms = out.embed_ms;
  return out;
}

// ── steps ───────────────────────────────────────────────────────────────────
const CONDITIONS = [
  ["normal", 4], ["quiet", 4], ["loud", 4], ["near", 4], ["far", 4],
];
const PHRASES = [
  "The quick brown fox jumps over the lazy dog near the riverbank.",
  "I need to check the weather before I head out this afternoon.",
  "Remind me to look at the storage drive comparison again tomorrow.",
  "There are seventeen boxes stacked in the back of the garage.",
  "Could you play something quiet while I finish reading this chapter?",
  "The blue car parked outside has been there since Thursday morning.",
];

function stepCard(n, title, active, done, body) {
  const c = el("div", "card step " + (active ? "active" : done ? "done" : ""));
  c.appendChild(el("h2", null, `${n}. ${title} ${done ? '<span class="ok">✓</span>' : ""}`));
  if (typeof body === "string") c.appendChild(el("div", null, body));
  else if (body) c.appendChild(body);
  return c;
}

function trialTable(rows) {
  if (!rows.length) return el("div", "dim", "No trials yet.");
  const t = el("table");
  // `top` is the ranking, `said` is what Nova actually asserted. They differ on
  // every honest rejection, and seeing both is how a human spots a run where
  // recognition is fine but the threshold is mis-set.
  t.innerHTML = "<tr><th>#</th><th>truth</th><th>cond</th><th>status</th>"
              + "<th>said</th><th>top</th><th>score</th><th>2nd</th><th>thr</th></tr>";
  rows.slice(-8).forEach((r,i) => {
    const tr = el("tr");
    tr.innerHTML = `<td>${rows.length-Math.min(8,rows.length)+i+1}</td><td>${r.truthName||r.truth}</td>`
      + `<td>${r.condition}</td><td>${r.status}</td>`
      + `<td>${r.predictedName||"<span class='dim'>—</span>"}</td><td>${r.topName||"-"}</td>`
      + `<td>${(r.top_score??0).toFixed(3)}</td>`
      + `<td>${r.second_score==null?"-":r.second_score.toFixed(3)}</td>`
      + `<td>${r.threshold==null?"-":r.threshold.toFixed(2)}</td>`;
    t.appendChild(tr);
  });
  return t;
}

async function enrollFlow(name, role, key) {
  const box = $("#enroll-"+key);
  box.innerHTML = "";
  const kept = [];
  for (let i = 0; i < 6; i++) {
    box.appendChild(el("div", "dim", `Sample ${i+1} of 6 — say: “${PHRASES[i]}”`));
    const b = el("button", "primary", `Record sample ${i+1} (4s)`);
    box.appendChild(b);
    await new Promise(res => b.onclick = res);
    b.disabled = true;
    const blob = await record(4000, b);
    kept.push(blob);
    b.textContent = `Sample ${i+1} recorded`;
  }
  const fd = new FormData();
  fd.append("display_name", name);
  fd.append("role", role);
  kept.forEach((b,i) => fd.append("files", b, `s${i}.webm`));
  box.appendChild(el("div", "dim", "Enrolling…"));
  const out = await api("/speaker/enroll", {method:"POST", body:fd});
  S.enroll[key] = out;
  if (key === "marcus") S.marcusId = out.profile_id; else S.guestId = out.profile_id;
  save();
}

async function trialsFlow(truthId, truthName, phase, count, target) {
  const box = $("#"+target);
  const plan = [];
  const per = Math.max(1, Math.round(count / CONDITIONS.length));
  CONDITIONS.forEach(([c]) => { for (let i=0;i<per;i++) plan.push(c); });
  while (plan.length < count) plan.push("normal");
  plan.length = count;

  for (let i = 0; i < count; i++) {
    box.innerHTML = "";
    box.appendChild(el("div", null,
      `<b>Trial ${i+1} / ${count}</b> — <span class="pill">${plan[i]}</span> `
      + `speak <b>${truthName}</b>, 3–4 seconds, a NEW sentence (not an enrollment phrase).`));
    const b = el("button", "primary", "Record trial");
    box.appendChild(b);
    await new Promise(res => b.onclick = res);
    b.disabled = true;
    const blob = await record(3500, b);
    let out;
    try { out = await identify(blob); }
    catch (e) { box.appendChild(el("div","bad","identify failed: "+e.message)); i--; continue; }
    S.latency.push({identify_ms: out.identify_ms, round_trip_ms: out.round_trip_ms});
    (phase === "V" ? S.validation : S.trials).push({
      truth: truthId, truthName,
      // TWO DIFFERENT THINGS, kept apart on purpose (V3 P5.2 final closure).
      //
      //   predicted_profile_id  the ASSERTED identity. Null unless `known`.
      //                         The recognition confusion matrix uses this and
      //                         only this — a rejection is not a prediction.
      //   top_profile_id        who merely RANKED FIRST, set even for unknown
      //                         and ambiguous. Calibration fits on this.
      //
      // Reading `out.profile_id` into `top_profile_id` (what this used to do)
      // silently discarded every rejected trial's attribution: a correct
      // `unknown` at Marcus 0.43 became a trial belonging to nobody, so the
      // score that bounds his false-accept rate never reached the fitter.
      predicted_profile_id: out.profile_id || null,
      predictedName: out.display_name || null,
      top_profile_id: out.top_scored_profile_id ?? null,
      topName: out.top_scored_display_name ?? null,
      top_score: out.similarity ?? 0,
      second_score: out.second_best_similarity ?? null,
      second_profile_id: out.second_best_profile_id ?? null,
      status: out.status || "", condition: plan[i], phase,
      threshold: out.threshold ?? null,
    });
    save();
  }
  box.innerHTML = "<span class='ok'>Done.</span>";
}

function confusion(rows) {
  // Recognition accuracy is about what Nova ASSERTED, so this reads
  // predicted_profile_id — never top_profile_id, which is only a ranking and
  // would count honest rejections as confident answers.
  const m = {swap:0, correct:{}, total:{}, unknown:0, ambiguous:0};
  rows.forEach(r => {
    m.total[r.truthName] = (m.total[r.truthName]||0)+1;
    if (r.status === "known") {
      if (r.predicted_profile_id === r.truth) m.correct[r.truthName]=(m.correct[r.truthName]||0)+1;
      else m.swap++;
    } else if (r.status === "ambiguous") m.ambiguous++;
    else m.unknown++;
  });
  return m;
}


// ── the live production pipeline: /stt (speaker=true) -> voice_turn_id -> /chat
async function voiceTurn(promptText, seconds, wantSpeaker, convId) {
  alert(promptText);
  const blob = await record(seconds*1000, null);
  const fd = new FormData();
  fd.append("file", blob, "cmd.webm");
  if (wantSpeaker) fd.append("speaker", "true");
  const t0 = performance.now();
  const stt = await api("/stt", {method:"POST", body:fd});
  const sttMs = Math.round(performance.now() - t0);
  const handle = stt?.speaker?.voice_turn_id || null;
  const chat = await api("/chat", {method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ message: stt.text || null, attachments: [],
                           input_source: "voice",
                           // Sent only when the caller supplies one. Without it
                           // Brain.chat() mints a new UUID per call.
                           ...(convId ? {conversation_id: convId} : {}),
                           ...(handle ? {voice_turn_id: handle} : {}) })});
  return { text: stt.text, speaker: stt.speaker || null, handle,
           reply: chat?.assistant ?? chat?.response ?? chat?.text ?? "",
           conversation_id: chat?.conversation_id ?? null,
           stt_ms: sttMs };
}

//: Statuses that genuinely mean "Nova did not identify this person". `known`
//: is NOT one of them: if the third speaker comes back recognised, the privacy
//: question was never asked and the result proves nothing either way.
const UNVERIFIED_OK = ["unknown", "ambiguous", "unavailable", "too_short"];

// Record a voice turn for the probe only — /stt, no /chat, so the voice_turn_id
// is still unredeemed and can be spent on the permission probe instead.
async function voiceHandle(promptText, seconds) {
  alert(promptText);
  const blob = await record(seconds*1000, null);
  const fd = new FormData();
  fd.append("file", blob, "cmd.webm");
  fd.append("speaker", "true");
  const stt = await api("/stt", {method:"POST", body:fd});
  return stt?.speaker || null;
}

async function sentinelFlow() {
  const M_S = "MARCUS-LIVE-551", G_S = "GUEST-LIVE-661";
  // ONE conversation for all five turns. Generated here, reused for every /chat,
  // and the id the server echoes back is checked each time — a silently ignored
  // conversation_id would otherwise reproduce the original bug invisibly.
  if (!S.sentinelConversationId) { S.sentinelConversationId = crypto.randomUUID(); save(); }
  const CID = S.sentinelConversationId;
  const out = { steps: [], conversation_id: CID, conversation_stable: true };

  const turn = async (who, phase, prompt, secs) => {
    const r = await voiceTurn(prompt, secs, true, CID);
    if (r.conversation_id && r.conversation_id !== CID) out.conversation_stable = false;
    out.steps.push({who, phase, status: r.speaker?.status ?? null,
                    name: r.speaker?.display_name ?? null,
                    profile_id: r.speaker?.profile_id ?? null,
                    conversation_id: r.conversation_id ?? null,
                    got_marcus: r.reply.includes(M_S), got_guest: r.reply.includes(G_S)});
    return r;
  };

  await turn("Marcus", "store",
    `Marcus: say — "Remember that my calibration sentinel is ${M_S}."`, 5);
  await turn("Guest", "store",
    `Guest: say — "Remember that my calibration sentinel is ${G_S}."`, 5);
  const mr = await turn("Marcus", "ask", 'Marcus: say — "What is my calibration sentinel?"', 4);
  const gr = await turn("Guest", "ask", 'Guest: say — "What is my calibration sentinel?"', 4);
  const ur = await turn("unverified", "ask",
    'UNVERIFIED: have someone NOT enrolled say — "What is my calibration sentinel?"', 4);

  // Were the two enrolled people actually recognised as THEMSELVES, and was the
  // third genuinely not recognised? Without these the privacy result is
  // unreadable: "the guest did not get Marcus's sentinel" means nothing if the
  // guest was never identified as the guest.
  const marcusTurns = out.steps.filter(s => s.who === "Marcus");
  const guestTurns  = out.steps.filter(s => s.who === "Guest");
  out.marcus_recognised = marcusTurns.every(s => s.status === "known" && s.profile_id === S.marcusId);
  out.guest_recognised  = guestTurns.every(s => s.status === "known" && s.profile_id === S.guestId);
  out.unverified_status = ur.speaker?.status ?? null;
  out.unverified_is_unverified = UNVERIFIED_OK.includes(out.unverified_status);
  if (!out.unverified_is_unverified) {
    out.note = `The third speaker came back "${out.unverified_status}". `
             + "The privacy check does NOT pass — re-run it with a genuinely "
             + "unenrolled person, or a real unverified condition.";
  }

  out.marcus_got_own = mr.reply.includes(M_S);
  out.guest_got_own = gr.reply.includes(G_S);
  out.guest_got_marcus = gr.reply.includes(M_S);
  out.unverified_got_either = ur.reply.includes(M_S) || ur.reply.includes(G_S);
  out.pass = out.conversation_stable
             && out.marcus_recognised && out.guest_recognised
             && out.unverified_is_unverified
             && out.marcus_got_own && out.guest_got_own
             && !out.guest_got_marcus && !out.unverified_got_either;
  return out;
}

async function permissionFlow() {
  // `computer.type` — a STANDARD-tier PRODUCTION actuator, not a data-routing
  // call. memory.remember was the wrong probe: it is not PermissionBroker-gated
  // at all, so asking it proved nothing about permissions.
  //
  // Safe because three independent things must hold before a keystroke could
  // exist, and none of them do: guarded mode answers needs_confirmation, the
  // probe never approves (it rejects its own request immediately), execution is
  // off by default, and no platform adapter ships.
  const CAP = "computer.type";

  // A. Typed reference — no voice handle at all. Whatever the configured mode
  //    decides here is the bar; the voice cases must match it exactly. Nothing
  //    is hardcoded to "needs_confirmation" so a non-default
  //    NOVA_PERMISSION_MODE still yields a meaningful comparison.
  const typed = await api("/speaker/permission-probe", {method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({capability: CAP})});

  // B & C. Real microphone -> /stt speaker=true -> backend-issued handle ->
  //        backend resolves identity -> the same probe. The browser never says
  //        who is speaking.
  const viaVoice = async (label, expectId) => {
    const spk = await voiceHandle(
      `${label}: say a short sentence for the permission probe.`, 4);
    const r = await api("/speaker/permission-probe", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({capability: CAP, voice_turn_id: spk?.voice_turn_id ?? null})});
    return { label, expected_profile_id: expectId,
             identity: r.identity, tier: r.tier, mode: r.mode,
             decision: r.decision, executed: r.executed,
             recognised: r.identity?.status === "known"
                      && r.identity?.profile_id === expectId };
  };
  const marcus = await viaVoice("Marcus", S.marcusId);
  const guest  = await viaVoice("Guest",  S.guestId);

  const sameDecision = marcus.decision === typed.decision
                    && guest.decision === typed.decision;
  const sameTier = marcus.tier === typed.tier && guest.tier === typed.tier;
  const nothingRan = !typed.executed && !marcus.executed && !guest.executed;

  return {
    capability: CAP, mode: typed.mode, tier: typed.tier,
    typed_reference: {decision: typed.decision, tier: typed.tier,
                      identity: typed.identity, executed: typed.executed},
    marcus, guest,
    // Both voice handles must have been recognised as their OWN profiles,
    // otherwise "the decision did not change" is trivially true and worthless.
    both_recognised: marcus.recognised && guest.recognised,
    same_decision: sameDecision, same_tier: sameTier, nothing_executed: nothingRan,
    execution_enabled: typed.execution_enabled,
    adapter_installed: typed.adapter_installed,
    pass: sameDecision && sameTier && nothingRan
          && marcus.recognised && guest.recognised,
    note: "PermissionBroker.evaluate() takes no identity argument. Measured, "
        + "not asserted: all three decisions are compared to the typed reference.",
  };
}

async function sttLatencyFlow() {
  const off = [], on = [];
  for (let i = 0; i < 6; i++) {
    const r = await voiceTurn(`Latency ${i+1}/12 (speaker OFF) — say a short sentence.`, 3, false);
    off.push(r.stt_ms);
  }
  for (let i = 0; i < 6; i++) {
    const r = await voiceTurn(`Latency ${i+7}/12 (speaker ON) — say a short sentence.`, 3, true);
    on.push(r.stt_ms);
  }
  const p = (a,q) => pct(a,q);
  return { stt_off_p50: p(off,.5), stt_off_p95: p(off,.95),
           stt_on_p50: p(on,.5),  stt_on_p95: p(on,.95),
           delta_p50: p(on,.5) - p(off,.5), delta_p95: p(on,.95) - p(off,.95),
           n_off: off.length, n_on: on.length };
}

function render() {
  const root = $("#steps"); root.innerHTML = "";
  const st = S.step;

  // 1 preflight
  const p = el("div");
  p.appendChild(el("div","dim","Check the backend, review existing profiles, and delete any stale ones deliberately."));
  const list = el("div", null, "<i class='dim'>press Check above</i>");
  list.id = "proflist"; p.appendChild(list);
  const go = el("button","primary","Start calibration");
  go.onclick = () => { S.step = 1; save(); };
  p.appendChild(go);
  root.appendChild(stepCard(1, "Preflight", st===0, st>0, p));

  // 2 Marcus enrollment
  const m = el("div");
  m.appendChild(el("div","dim","Six samples, 4 seconds each, different phrases. At least 5 must survive the quality gate."));
  m.appendChild(el("div",null,"")).id = "enroll-marcus";
  const mb = el("button","primary","Enrol Marcus (owner)");
  mb.onclick = async () => { mb.disabled=true; try { await enrollFlow("Marcus","owner","marcus"); S.step=2; save(); }
                             catch(e){ alert(e.message); mb.disabled=false; } };
  m.appendChild(mb);
  if (S.enroll.marcus) {
    const e = S.enroll.marcus;
    m.appendChild(el("div", e.meets_p52_bar?"ok":"bad",
      `kept ${e.sample_count} samples · consistency ${(e.consistency??0).toFixed(3)} · `
      + (e.meets_p52_bar ? "meets the P5.2 bar" : (e.note||"below the P5.2 bar"))));
  }
  root.appendChild(stepCard(2, "Enrol Marcus", st===1, st>1, m));

  // 3 Marcus trials (phase A)
  const a = el("div");
  a.appendChild(el("div","dim","20 fresh utterances: 4 normal, 4 quiet, 4 loud, 4 near, 4 far."));
  const a1 = el("div"); a1.id="trials-marcus"; a.appendChild(a1);
  const ab = el("button","primary","Start Marcus trials (20)");
  ab.onclick = async () => { ab.disabled=true;
    await trialsFlow(S.marcusId,"Marcus","A",20,"trials-marcus"); S.step=3; save(); };
  a.appendChild(ab);
  root.appendChild(stepCard(3, "Marcus trials — phase A", st===2, st>2, a));

  // 4 unenrolled guest (impostor) trials
  const g = el("div");
  g.appendChild(el("div","dim","The guest is NOT enrolled yet. These 12 utterances measure how close a real stranger gets to Marcus — the impostor distribution."));
  const g1 = el("div"); g1.id="trials-impostor"; g.appendChild(g1);
  const gb = el("button","primary","Start impostor trials (12)");
  gb.onclick = async () => { gb.disabled=true;
    await trialsFlow("__impostor__","Guest (unenrolled)","A",12,"trials-impostor"); S.step=4; save(); };
  g.appendChild(gb);
  root.appendChild(stepCard(4, "Unenrolled guest trials", st===3, st>3, g));

  // 5 guest enrollment
  const ge = el("div");
  ge.appendChild(el("div","dim","Now enrol the guest — six samples, same rules."));
  ge.appendChild(el("div",null,"")).id = "enroll-guest";
  const geb = el("button","primary","Enrol guest");
  geb.onclick = async () => { geb.disabled=true;
    const nm = prompt("Guest's first name?") || "Guest";
    try { await enrollFlow(nm,"guest","guest");
          // Relabel the impostor trials now that the guest has an id.
          S.trials.forEach(t => { if (t.truth === "__impostor__") t.truth = S.guestId; });
          S.step=5; save(); }
    catch(e){ alert(e.message); geb.disabled=false; } };
  ge.appendChild(geb);
  if (S.enroll.guest) {
    const e = S.enroll.guest;
    ge.appendChild(el("div", e.meets_p52_bar?"ok":"bad",
      `kept ${e.sample_count} samples · consistency ${(e.consistency??0).toFixed(3)}`));
  }
  root.appendChild(stepCard(5, "Enrol the guest", st===4, st>4, ge));

  // 6 two-profile trials (phase B)
  const b2 = el("div");
  b2.appendChild(el("div","dim","12 each, varied conditions. These calibrate the margin between two real people."));
  const b1 = el("div"); b1.id="trials-b"; b2.appendChild(b1);
  const bb = el("button","primary","Start two-profile trials (12 + 12)");
  bb.onclick = async () => { bb.disabled=true;
    await trialsFlow(S.marcusId,"Marcus","B",12,"trials-b");
    alert("Now the GUEST speaks for the next 12.");
    await trialsFlow(S.guestId, S.enroll.guest?.display_name || "Guest","B",12,"trials-b");
    S.step=6; save(); };
  b2.appendChild(bb);
  b2.appendChild(trialTable(S.trials));
  root.appendChild(stepCard(6, "Two-profile trials — phase B", st===5, st>5, b2));

  // 7 proposal
  const pr = el("div");
  const pb = el("button","primary","Compute proposed calibration");
  pb.onclick = async () => {
    try {
      const out = await api("/speaker/calibration", {method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({trials: S.trials.map(t => ({
          truth:t.truth, top_profile_id:t.top_profile_id, top_score:t.top_score,
          second_score:t.second_score, second_profile_id:t.second_profile_id,
          status:t.status, condition:t.condition, phase:t.phase})), apply:false})});
      S.proposal = out; save();
    } catch(e){ alert(e.message); }
  };
  pr.appendChild(pb);
  if (S.proposal) {
    pr.appendChild(el("div", S.proposal.ok?"ok":"bad",
      (S.proposal.ok ? "Calibration fits: " : "CALIBRATION FAILED: ") + S.proposal.reason));
    pr.appendChild(el("pre", null, JSON.stringify(S.proposal, null, 2)));
    if (S.proposal.ok) {
      const ap = el("button","primary","Apply calibration");
      ap.onclick = async () => {
        if (!confirm("Persist these thresholds and margin?")) return;
        try {
          await api("/speaker/calibration", {method:"POST",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify({trials: S.trials.map(t => ({
              truth:t.truth, top_profile_id:t.top_profile_id, top_score:t.top_score,
              second_score:t.second_score, second_profile_id:t.second_profile_id,
              status:t.status, condition:t.condition, phase:t.phase})), apply:true})});
          S.applied = true; S.step = 7; save();
        } catch(e){ alert(e.message); }
      };
      pr.appendChild(ap);
    }
  }
  root.appendChild(stepCard(7, "Proposed calibration", st===6, st>6, pr));

  // 8 validation
  const v = el("div");
  v.appendChild(el("div","dim","FRESH utterances only — none may reuse a calibration recording. 10 each, varied conditions."));
  const v1 = el("div"); v1.id="trials-v"; v.appendChild(v1);
  const vb = el("button","primary","Start validation (10 + 10)");
  vb.onclick = async () => { vb.disabled=true;
    await trialsFlow(S.marcusId,"Marcus","V",10,"trials-v");
    alert("Now the GUEST speaks for the next 10.");
    await trialsFlow(S.guestId, S.enroll.guest?.display_name || "Guest","V",10,"trials-v");
    S.step=8; save(); };
  v.appendChild(vb);
  v.appendChild(trialTable(S.validation));
  root.appendChild(stepCard(8, "Fresh validation", st===7, st>7, v));

  // 9 memory attribution through the REAL voice pipeline
  const ms = el("div");
  ms.appendChild(el("div","dim",
    "Uses the real pipeline: /stt with speaker=true → voice_turn_id → /chat. "
    + "Marcus stores his sentinel, the guest stores theirs, then each asks for their own."));
  const msb = el("button","primary","Run memory-attribution check");
  msb.onclick = async () => { msb.disabled = true;
    try { S.sentinel = await sentinelFlow(); S.step = 9; save(); }
    catch(e){ alert(e.message); msb.disabled = false; } };
  ms.appendChild(msb);
  if (S.sentinel) {
    ms.appendChild(el("div", S.sentinel.pass?"ok":"bad",
      S.sentinel.pass ? "Attribution PASS" : "Attribution FAIL"));
    ms.appendChild(el("pre", null, JSON.stringify(S.sentinel, null, 2)));
  }
  root.appendChild(stepCard(9, "Memory attribution — live voice", st===8, st>8, ms));

  // 10 permission regression
  const pm = el("div");
  pm.appendChild(el("div","dim",
    "The real PermissionBroker, via ComputerControl, on <b>computer.type</b> — a "
    + "STANDARD-tier actuator. Asked three ways: typed, as recognised Marcus, as "
    + "recognised guest. All three decisions must match the typed reference. "
    + "Nothing can be typed: the probe rejects its own request, execution is off, "
    + "and no adapter ships."));
  const pmb = el("button","primary","Run permission regression");
  pmb.onclick = async () => { pmb.disabled = true;
    try { S.permission = await permissionFlow(); S.step = 10; save(); }
    catch(e){ alert(e.message); pmb.disabled = false; } };
  pm.appendChild(pmb);
  if (S.permission) {
    pm.appendChild(el("div", S.permission.pass?"ok":"bad",
      S.permission.pass ? "Permission regression PASS — identical decisions"
                        : "Permission regression FAIL"));
    pm.appendChild(el("pre", null, JSON.stringify(S.permission, null, 2)));
  }
  root.appendChild(stepCard(10, "Permission regression", st===9, st>9, pm));

  // 11 latency
  const lt = el("div");
  lt.appendChild(el("div","dim","/stt with speaker OFF vs ON, on real microphone audio. 6 each."));
  const ltb = el("button","primary","Measure /stt latency (12 recordings)");
  ltb.onclick = async () => { ltb.disabled = true;
    try { S.sttLatency = await sttLatencyFlow(); S.statusAfter = await api("/speaker/status"); S.step = 11; save(); }
    catch(e){ alert(e.message); ltb.disabled = false; } };
  lt.appendChild(ltb);
  if (S.sttLatency) lt.appendChild(el("pre", null, JSON.stringify(S.sttLatency, null, 2)));
  root.appendChild(stepCard(11, "Latency", st===10, st>10, lt));

  // 12 report
  const rep = el("div");
  const recog = S.validation.length ? confusion(S.validation) : null;
  const recogPass = recog && recog.swap === 0
    && Object.keys(recog.total).every(n => (recog.correct[n]||0) / recog.total[n] >= 0.9);

  // EXACTLY two compatible profiles, and exactly the two this run enrolled.
  // Checked directly rather than inferred from threshold_calibrated: a third
  // profile left over from an earlier session changes what every threshold
  // means, and "calibrated" would not necessarily say so.
  const compat = (S.statusAfter?.profiles_detail ?? []).filter(p => p.compatible);
  const compatIds = compat.map(p => p.profile_id).sort();
  const wantIds = [S.marcusId, S.guestId].filter(Boolean).sort();
  const roleOf = id => (compat.find(p => p.profile_id === id) || {}).role ?? null;
  const twoProfiles = {
    compatible_count: compat.length,
    compatible_ids: compatIds,
    expected_ids: wantIds,
    marcus_role: roleOf(S.marcusId),
    guest_role: roleOf(S.guestId),
    exactly_two: compat.length === 2
                 && wantIds.length === 2
                 && JSON.stringify(compatIds) === JSON.stringify(wantIds),
    roles_correct: roleOf(S.marcusId) === "owner" && roleOf(S.guestId) === "guest",
  };
  twoProfiles.pass = twoProfiles.exactly_two && twoProfiles.roles_correct;

  // Recognition passing is NOT P5.2 passing. Every required item must have run.
  const missing = [];
  if (!(S.enroll.marcus?.meets_p52_bar)) missing.push("Marcus enrollment >=5 samples");
  if (!(S.enroll.guest?.meets_p52_bar)) missing.push("guest enrollment >=5 samples");
  if (!S.applied) missing.push("calibration applied");
  if (!(S.statusAfter?.threshold_calibrated)) missing.push("status threshold_calibrated == true");
  if (!S.statusAfter) missing.push("post-run /speaker/status");
  if (!S.validation.length) missing.push("fresh recognition validation");
  if (!S.sentinel) missing.push("memory attribution");
  if (!S.permission) missing.push("permission regression");
  if (!S.sttLatency) missing.push("latency measurement");

  const failed = [];
  if (recog && !recogPass) failed.push("recognition validation");
  if (S.sentinel && !S.sentinel.pass) failed.push("memory attribution");
  if (S.sentinel && !S.sentinel.conversation_stable) failed.push("sentinel conversation id not stable");
  if (S.sentinel && !S.sentinel.unverified_is_unverified) failed.push("third speaker was recognised — privacy check invalid");
  if (S.permission && !S.permission.pass) failed.push("permission regression");
  if (S.statusAfter && !twoProfiles.pass) failed.push("exactly-two-profile requirement");

  const acceptance = failed.length ? "FAIL" : (missing.length ? "NOT COMPLETE" : "PASS");

  if (recog) {
    rep.appendChild(el("div", recogPass?"ok":"bad",
      "RECOGNITION VALIDATION: " + (recogPass ? "PASS" : "FAIL")
      + ` — ${recog.swap} identity swap(s)`));
  }
  rep.appendChild(el("div", acceptance==="PASS"?"ok":(acceptance==="FAIL"?"bad":"warn"),
    "P5.2 HUMAN ACCEPTANCE: " + acceptance
    + (missing.length ? " — still to run: " + missing.join(", ") : "")
    + (failed.length ? " — failed: " + failed.join(", ") : "")));

  const report = {
    protocol: "V3 P5.2", generated_at: new Date().toISOString(),
    model_id: S.statusAfter?.model_id ?? null,
    model_revision: S.statusAfter?.model_revision ?? null,
    calibrated_at: S.statusAfter?.calibrated_at ?? null,
    threshold_calibrated: S.statusAfter?.threshold_calibrated ?? null,
    margin: S.statusAfter?.margin ?? null,
    margin_source: S.statusAfter?.margin_source ?? null,
    threshold_source: S.statusAfter?.threshold_source ?? null,
    profiles: S.statusAfter?.profiles_detail ?? null,
    enrollment: S.enroll, calibration: S.proposal, applied: S.applied,
    recognition: recog ? {
      confusion: recog, identity_swaps: recog.swap,
      false_accepts: recog.swap, false_rejects: recog.unknown + recog.ambiguous,
      unknown: recog.unknown, ambiguous: recog.ambiguous,
      per_speaker: Object.keys(recog.total).map(n =>
        ({name:n, correct:recog.correct[n]||0, total:recog.total[n]})),
    } : null,
    memory_attribution: S.sentinel, permission_regression: S.permission,
    two_profile_requirement: twoProfiles,
    latency: {
      identify_p50: pct(S.latency.map(x=>x.identify_ms), .50),
      identify_p95: pct(S.latency.map(x=>x.identify_ms), .95),
      stt: S.sttLatency,
    },
    trials_collected: S.trials.length,
    recognition_validation: recog ? (recogPass ? "PASS" : "FAIL") : "NOT RUN",
    p52_human_acceptance: acceptance,
  };
  rep.appendChild(el("pre", null, JSON.stringify(report, null, 2)));
  const cp = el("button", null, "Copy report JSON");
  cp.onclick = () => navigator.clipboard.writeText(JSON.stringify(report, null, 2));
  rep.appendChild(cp);
  const rs = el("button","danger","Reset everything"); rs.onclick = reset;
  rep.appendChild(rs);
  root.appendChild(stepCard(12, "Final report", st>=11, false, rep));
}

function pct(a, q) {
  if (!a.length) return null;
  const s = a.slice().sort((x,y)=>x-y);
  return s[Math.max(0, Math.min(s.length-1, Math.round(q*(s.length-1))))];
}

$("#ping").onclick = async () => {
  const out = $("#pingout");
  try {
    const st = await api("/speaker/status");
    const pr = await api("/speaker/profiles");
    out.innerHTML = `<span class="ok">connected</span> · model ${st.model_id||"?"} `
      + `· calibrated: <b>${st.threshold_calibrated}</b> · margin ${st.margin} (${st.margin_source})`;
    const box = $("#proflist"); box.innerHTML = "";
    if (!pr.profiles.length) box.appendChild(el("div","dim","No profiles enrolled."));
    pr.profiles.forEach(p => {
      const row = el("div", null,
        `<span class="pill">${p.role}</span> <b>${p.name||p.display_name}</b> `
        + `<span class="dim">${p.profile_id} · ${p.sample_count} samples · ${p.status||""}</span> `);
      const d = el("button","danger","Delete");
      d.onclick = async () => { if(!confirm(`Delete ${p.name||p.display_name}?`))return;
        await api("/speaker/profiles/"+p.profile_id, {method:"DELETE"}); $("#ping").click(); };
      row.appendChild(d);
      box.appendChild(row);
    });
  } catch (e) { out.innerHTML = `<span class="bad">${e.message}</span>`; }
};

render();
</script>
