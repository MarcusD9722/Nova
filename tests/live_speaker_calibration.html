    const st = await api("/speaker/status");
    S.statusAfter = st;
    curIds = compatibleIds(pr.profiles);
    build = buildOf(st);
  } catch (e) { alertBanner(`Could not read the backend: ${e.message}`); return false; }

  // Anything ALREADY recorded whose centroids have since vanished blocks here —
  // but a larger population does not, because that is the designed step-5
  // progression.
  const stale = staleLineage(S, curIds, build);
  if (stale.length) {
    alertBanner(
      `<b>Blocked — earlier evidence was scored against centroids that no longer `
      + `exist.</b><br>`
      + stale.map(s => `<code>${s.block}</code>: ${s.why}`).join("<br>")
      + `<br><br>Reset and run one clean calibration.`);
    return false;
  }
  if (handoffTitle) await handoff(handoffTitle, handoffBody);
  const conds = planConditions(count);
  const ok = await runBlock({
    id, who:truthName, title:`${phase === "V" ? "validation" : "trials"} — speak naturally`,
    count, seconds: phase === "V" ? DUR.validation : DUR.trial,
    condFor: i => conds[i],
    cueOf: i => cueFor(pool, i),
    doSample: async (blob, i, cond) => {
      const out = await identify(blob);
      const built = buildTrialRow(out, {truthId, truthName, phase, condition:cond, block:id});
      // Handed back, NOT stored here — runBlock commits row + index atomically.
      return {row: built.row, store: built.store,
              note: `${out.status}${out.similarity!=null ? " · "+out.similarity.toFixed(3) : ""}`};
    },
  });
  // Honest lineage: the centroids these scores were ACTUALLY measured against.
  // For Phase A that is Marcus alone, and relabelling the impostor rows' truth
  // later does not change it.
  if (ok) { recordLineage(S, id, curIds, build); save(); }
  if (ok && stepAfter != null) { S.step = stepAfter; save(); }
  return ok;
}

function render() {
  if (!HAS_DOM) return;
  const root = $("#steps"); root.innerHTML = "";
  const st = S.step;
  const plan = {}; blockPlan().forEach(b => plan[b.id] = b);

  // 1 preflight
  const p = el("div");
  p.appendChild(el("div","dim","Check the backend, review existing profiles, and delete any stale ones deliberately. The guest does not need to be here yet."));
  const list = el("div", null, "<i class='dim'>press Check above</i>");
  list.id = "proflist"; p.appendChild(list);

      `kept ${e.sample_count} samples · consistency ${(e.consistency??0).toFixed(3)} · `

  }
  root.appendChild(stepCard(2, "Enrol Marcus", st===1, st>1, m));

  // 3 Marcus trials (phase A)
  const a = el("div");
  a.appendChild(el("div","dim","20 fresh utterances: 4 normal, 4 quiet, 4 loud, 4 near, 4 far. Auto-advances; still just Marcus."));
  a.appendChild(blockStatus("trials_marcus", 20));
  const ab = el("button","primary","Start Marcus trials (20)");
  ab.onclick = async () => { ab.disabled=true;
    try { await runTrialBlock({id:"trials_marcus", truthId:S.marcusId, truthName:"Marcus",
            phase:"A", count:20, pool:CAL_CUES, stepAfter:3}); }
    catch(e){ alertBanner(e.message); } finally { ab.disabled=false; render(); } };
  a.appendChild(ab);
  root.appendChild(stepCard(3, "Marcus trials — phase A", st===2, st>2, a));

  // 4 unenrolled guest (impostor) trials
  const g = el("div");
  g.appendChild(el("div","dim","<b>The guest joins now.</b> They are NOT enrolled yet — these 12 utterances measure how close a real stranger gets to Marcus, which is the impostor evidence the whole threshold rests on."));
  g.appendChild(blockStatus("trials_guest", 12));
  const gb = el("button","primary","Start impostor trials (12)");
  gb.onclick = async () => { gb.disabled=true;
    try { await runTrialBlock({id:"trials_guest", truthId:"__impostor__",
            truthName:"Guest (unenrolled)", phase:"A", count:12, pool:CAL_CUES, stepAfter:4,
            handoffTitle:"The guest takes over now",
            handoffBody:"12 recordings, about a minute. They are not enrolled yet — that is the point."}); }
    catch(e){ alertBanner(e.message); } finally { gb.disabled=false; render(); } };
  g.appendChild(gb);
  root.appendChild(stepCard(4, "Unenrolled guest trials", st===3, st>3, g));

  // 5 guest enrollment
  const ge = el("div");
  ge.appendChild(el("div","dim","Now enrol the guest — six phrases, same rules."));
  ge.appendChild(blockStatus("enroll_guest", 6));
  const geb = el("button","primary","Enrol guest — one click, 6 samples");
  geb.onclick = async () => { geb.disabled=true;
    const nm = prompt("Guest's first name?") || "Guest";
    try {
      if (await runEnrollBlock("guest", nm, "guest", "enroll_guest", 5)) {
        // Relabel the impostor trials now that the guest has an id.
        S.trials.forEach(t => { if (t.truth === "__impostor__") { t.truth = S.guestId; t.truthName = nm; } });
        save();
      }
    } catch(e){ alertBanner(e.message); } finally { geb.disabled=false; render(); } };
  ge.appendChild(geb);
  if (S.enroll.guest) {
    const e = S.enroll.guest;
    ge.appendChild(el("div", e.meets_p52_bar?"ok":"bad",

  }
  root.appendChild(stepCard(5, "Enrol the guest", st===4, st>4, ge));

  // 6 two-profile trials (phase B) — Marcus block, then guest block
  const b2 = el("div");
  b2.appendChild(el("div","dim","12 each. One handoff in the middle, not one per utterance."));
  b2.appendChild(blockStatus("phaseb_marcus", 12));
  b2.appendChild(blockStatus("phaseb_guest", 12));
  const bb = el("button","primary","Start two-profile trials (12 + 12)");
  bb.onclick = async () => { bb.disabled=true;
    try {
      const gname = S.enroll.guest?.display_name || "Guest";
      const okm = await runTrialBlock({id:"phaseb_marcus", truthId:S.marcusId, truthName:"Marcus",
        phase:"B", count:12, pool:CAL_CUES,
        handoffTitle:"Marcus records 12", handoffBody:"Then the guest records 12."});
      if (okm) await runTrialBlock({id:"phaseb_guest", truthId:S.guestId, truthName:gname,
        phase:"B", count:12, pool:CAL_CUES, stepAfter:6,
        handoffTitle:`${gname} records 12 now`, handoffBody:"Same conditions, fresh sentences."});
    } catch(e){ alertBanner(e.message); } finally { bb.disabled=false; render(); } };
  b2.appendChild(bb);
  b2.appendChild(trialTable(S.trials));
  root.appendChild(stepCard(6, "Two-profile trials — phase B", st===5, st>5, b2));

  // 7 proposal
  const pr = el("div");
  const pb = el("button","primary","Compute proposed calibration");
  pb.onclick = async () => {
    // Generation only: thresholds are not calibrated YET at proposal time.
    if (!(await policyPreflight("Computing a proposal", {generationOnly:true}))) return;
    try {
      const out = await api("/speaker/calibration", {method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({trials: S.trials.map(trialPayload), apply:false})});
      S.proposal = out;
      if (out.generation_ok === false) {
        alertBanner("<b>The backend rejected this evidence as a stale profile "
          + "generation.</b><br>" + (out.generation_problems || []).join("<br>"));
      }
      save();
    } catch(e){ alertBanner(e.message); }
  };
  pr.appendChild(pb);
  if (S.proposal) {
    pr.appendChild(el("div", S.proposal.ok?"ok":"bad",
      (S.proposal.ok ? "Calibration fits: " : "CALIBRATION FAILED: ") + S.proposal.reason));
    pr.appendChild(el("pre", null, JSON.stringify(S.proposal, null, 2)));
    if (S.proposal.ok) {
      const ap = el("button","primary","Apply calibration");
      ap.onclick = async () => {
        if (!(await policyPreflight("Applying calibration", {generationOnly:true}))) return;
        if (!confirm("Persist these thresholds and margin?")) return;
        try {
          await api("/speaker/calibration", {method:"POST",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify({trials: S.trials.map(trialPayload), apply:true})});
          S.applied = true;
          // CHECK THE EFFECTIVE POLICY NOW, not at the report. `calibrated`
          // only means a valid record exists; NOVA_SPEAKER_THRESHOLD or
          // NOVA_SPEAKER_MARGIN silently outrank it. Discovering that after
          // steps 8-11 would mean validating a policy nobody calibrated.
          const st = await api("/speaker/status");
          S.statusAfter = st; save();
          if (st.threshold_source !== "calibrated" || st.margin_source !== "calibrated") {
            alertBanner(
              `<b>Calibration applied, but it is NOT the effective policy.</b><br>`
              + `threshold_source = <code>${st.threshold_source}</code>, `
              + `margin_source = <code>${st.margin_source}</code>.<br>`
              + `An environment override is in force. <b>Stop here</b>: unset `
              + `<code>NOVA_SPEAKER_THRESHOLD</code> / <code>NOVA_SPEAKER_MARGIN</code>, `
              + `restart the backend, press Check, then continue. Validating steps 8-11 `
              + `now would measure a policy that is not the calibrated one.`);
          } else {
            S.step = 7;
          }
          save();
        } catch(e){ alertBanner(e.message); }
      };
      pr.appendChild(ap);
    }
  }
  root.appendChild(stepCard(7, "Proposed calibration", st===6, st>6, pr));

  // 8 validation
  const v = el("div");
  v.appendChild(el("div","dim","FRESH utterances only — a different cue pool from calibration, and stored separately. 10 each."));
  v.appendChild(blockStatus("valid_marcus", 10));
  v.appendChild(blockStatus("valid_guest", 10));
  const vb = el("button","primary","Start validation (10 + 10)");
  vb.onclick = async () => { vb.disabled=true;
    try {
      // Validation under an env override would measure a policy nobody
      // calibrated. Checked before the first recording.
      if (!(await policyPreflight("Step 8 validation"))) { vb.disabled=false; return; }
      const gname = S.enroll.guest?.display_name || "Guest";
      const okm = await runTrialBlock({id:"valid_marcus", truthId:S.marcusId, truthName:"Marcus",
        phase:"V", count:10, pool:VAL_CUES,
        handoffTitle:"Marcus validates — 10 fresh utterances", handoffBody:"None of these may reuse a calibration sentence."});
      if (okm) await runTrialBlock({id:"valid_guest", truthId:S.guestId, truthName:gname,
        phase:"V", count:10, pool:VAL_CUES, stepAfter:8,
        handoffTitle:`${gname} validates — 10 fresh utterances`, handoffBody:"Last of the trial blocks."});
    } catch(e){ alertBanner(e.message); } finally { vb.disabled=false; render(); } };
  v.appendChild(vb);
  v.appendChild(trialTable(S.validation));
  root.appendChild(stepCard(8, "Fresh validation", st===7, st>7, v));

  // 9 memory attribution
  const ms = el("div");
  ms.appendChild(el("div","dim",
    "The real pipeline: /stt with speaker=true → voice_turn_id → /chat, all five turns in ONE conversation. "
    + "<b>Needs a third, unenrolled voice for the last turn</b> — or a genuinely unverified condition, which only counts if the backend actually returns one."));
  const msb = el("button","primary","Run memory-attribution check (5 turns)");
  // Mandatory-gate prerequisites. The CARD and any failed result stay visible
  // and copyable — only proceeding is prevented.
  if (!step9Ready(S)) {
    msb.disabled = true;
    ms.appendChild(el("div","warn",
      "Complete enrolment, calibration and step 8 validation first."));
  }
  msb.onclick = async () => { msb.disabled = true;
    // Policy FIRST — before the mic opens and before anything is cleared, so a
    // block costs no recordings and loses no prior evidence.
    if (!(await policyPreflight("Step 9"))) { msb.disabled = false; render(); return; }
    // Only now: the previous result is cleared BEFORE the run, not after, so an
    // aborted or failed retry never leaves an earlier PASS on screen
    // masquerading as this run's evidence. Steps 1-8 state is untouched.
    S.sentinel = null; save();
    try {
      const r = await sentinelFlow();
      if (r) {
        S.sentinel = r;
        // ONLY a passing gate advances the workflow. A failure keeps the human
        // on step 9 — but the JSON stays visible so it can be copied.
        if (r.pass) S.step = 9;
        save();
        if (!r.pass) alertBanner("Step 9 FAILED — staying on step 9. The full "
          + "diagnostics are below and can be copied.");
      } else {
        alertBanner("Step 9 was aborted. Nothing from it counts; run it again "
          + "and it will use a fresh conversation.");
      }
    }
    catch(e){ alertBanner(e.message); } finally { msb.disabled = false; render(); } };
  ms.appendChild(msb);
  if (S.sentinel) {
    ms.appendChild(el("div", S.sentinel.pass?"ok":"bad",
      S.sentinel.pass ? "Attribution PASS" : "Attribution FAIL"));

    pmb.disabled = true;
    pm.appendChild(el("div","warn",
      S.sentinel && !S.sentinel.pass
        ? "Step 9 FAILED. Fix and re-run step 9 before continuing — its "
          + "diagnostics stay below."
        : (S.sentinel && S.sentinel.evidence_revision !== STEP9_EVIDENCE_REVISION
             ? "Step 9 evidence is from an older protocol. Re-run step 9."
             : "Step 9 must PASS first.")));
  }
  pmb.onclick = async () => { pmb.disabled = true;
    S.permission = null; save();      // same rule: no stale PASS may survive

    catch(e){ alertBanner(e.message); } finally { pmb.disabled = false; render(); } };

  lt.appendChild(blockStatus("latency", 12));
  const ltb = el("button","primary","Measure /stt latency (12 recordings)");
  if (!step11Ready(S)) {
    ltb.disabled = true;
    lt.appendChild(el("div","warn", "The permission regression must PASS first."));
  }
  ltb.onclick = async () => { ltb.disabled = true;
    try { const r = await sttLatencyFlow();
          if (r) { S.sttLatency = r; S.statusAfter = await api("/speaker/status"); S.step = 11; save(); } }
    catch(e){ alertBanner(e.message); } finally { ltb.disabled = false; render(); } };
  lt.appendChild(ltb);
  if (S.sttLatency) lt.appendChild(el("pre", null, JSON.stringify(S.sttLatency, null, 2)));
  root.appendChild(stepCard(11, "Latency", st===10, st>10, lt));

  // 12 report
  const rep = el("div");
  const A = computeAcceptance(S);

  if (A.recog) {
    rep.appendChild(el("div", A.recogPass?"ok":"bad",
      "RECOGNITION VALIDATION: " + (A.recogPass ? "PASS" : "FAIL")
      + ` — ${A.recog.swap} identity swap(s)`));
  }
  rep.appendChild(el("div", A.acceptance==="PASS"?"ok":(A.acceptance==="FAIL"?"bad":"warn"),
    "P5.2 HUMAN ACCEPTANCE: " + A.acceptance
    + (A.missing.length ? " — still to run: " + A.missing.join(", ") : "")
    + (A.failed.length ? " — failed: " + A.failed.join(", ") : "")));

  const pg = progress();
  const report = {
    protocol: "V3 P5.2", generated_at: new Date().toISOString(),
    model_id: S.statusAfter?.model_id ?? null,
    model_revision: S.statusAfter?.model_revision ?? null,
    calibrated_at: S.statusAfter?.calibrated_at ?? null,
    threshold_calibrated: S.statusAfter?.threshold_calibrated ?? null,
    margin: S.statusAfter?.margin ?? null,

    threshold_source: S.statusAfter?.threshold_source ?? null,
    profiles: S.statusAfter?.profiles_detail ?? null,
    enrollment: S.enroll, calibration: S.proposal, applied: S.applied,
    sample_counts: A.counts,
    conditions: (() => { const c = {};
      S.trials.concat(S.validation).forEach(t => { c[t.condition] = (c[t.condition]||0)+1; });
      return c; })(),
    attribution_audit: A.audit,
    profile_generation: A.generation,
    recognition: A.recog ? {
      confusion: A.recog, identity_swaps: A.recog.swap,
      false_accepts: A.recog.swap, false_rejects: A.recog.unknown + A.recog.ambiguous,
      unknown: A.recog.unknown, ambiguous: A.recog.ambiguous,
      per_speaker: Object.keys(A.recog.total).map(n =>
        ({name:n, correct:A.recog.correct[n]||0, total:A.recog.total[n]})),
    } : null,
    score_summary: (() => {
      const all = S.trials.concat(S.validation);
      const tops = all.map(t => t.top_score).filter(x => x != null);
      const secs = all.map(t => t.second_score).filter(x => x != null);
      return {n: all.length,
              top_p05: pct(tops,.05), top_p50: pct(tops,.5), top_p95: pct(tops,.95),
              second_p50: pct(secs,.5), second_p95: pct(secs,.95)};
    })(),
    memory_attribution: S.sentinel, permission_regression: S.permission,
    two_profile_requirement: A.twoProfiles,
    latency: {
      identify_p50: pct(S.latency.map(x=>x.identify_ms), .50),
      identify_p95: pct(S.latency.map(x=>x.identify_ms), .95),
      stt: S.sttLatency,
    },
    session: {recordings_completed: pg.done, recordings_total: pg.total,
              elapsed_ms: pg.elapsed},
    trials_collected: S.trials.length,
    validation_collected: S.validation.length,
    recognition_validation: A.recog ? (A.recogPass ? "PASS" : "FAIL") : "NOT RUN",
    p52_human_acceptance: A.acceptance,
  };
  rep.appendChild(el("pre", null, JSON.stringify(report, null, 2)));
  const cp = el("button", null, "Copy report JSON");
  cp.onclick = () => navigator.clipboard.writeText(JSON.stringify(report, null, 2));
  rep.appendChild(cp);
  const rs = el("button","danger","Reset everything"); rs.onclick = reset;
  rep.appendChild(rs);
  root.appendChild(stepCard(12, "Final report", st>=11, false, rep));
}

if (HAS_DOM) {
  // Recover from an interrupted enrollment BEFORE anything is rendered. The
  // clips behind that progress no longer exist, so the count would otherwise
  // let a half-enrollment upload as if it were six samples.
  const wiped = reconcileEnrollment(S);
  if (wiped.length) {
    save();
    setTimeout(() => alertBanner(
      `An earlier enrollment (${wiped.join(", ")}) was interrupted before it `
      + "reached the backend. Enrollment audio is held in memory and never "
      + "written to disk, so those clips are gone and that block has been reset "
      + "to 0 of 6. <b>Those six recordings must be taken again</b> — nothing "
      + "was uploaded, and no profile was created."), 0);
  }

  $("#ping").onclick = async () => {
    const out = $("#pingout");
    try {
      const st = await api("/speaker/status");
      const pr = await api("/speaker/profiles");
      // PERSIST it. The instructions tell Marcus to press Check and confirm both
      // sources, but Check used to display only the margin source and threw the
      // status away — so a resumed session had no statusAfter for the preflights
      // or the report to read.
      S.statusAfter = st; save();
      const ok = calibratedPolicyStatus(st);
      out.innerHTML = `<span class="ok">connected</span> · model ${st.model_id||"?"}<br>`
        + `threshold <b>${st.threshold}</b> · source `
        + `<b class="${st.threshold_source === "calibrated" ? "ok" : "bad"}">`
        + `${st.threshold_source}</b><br>`
        + `margin <b>${st.margin}</b> · source `
        + `<b class="${st.margin_source === "calibrated" ? "ok" : "bad"}">`
        + `${st.margin_source}</b><br>`
        + `threshold_calibrated: <b class="${st.threshold_calibrated ? "ok" : "bad"}">`
        + `${st.threshold_calibrated}</b><br>`
        + (ok ? `<span class="ok">Effective policy IS the calibrated one.</span>`
              : `<span class="bad">EFFECTIVE POLICY IS NOT CALIBRATED — `
                + `${policyProblem(st)}.</span> Unset NOVA_SPEAKER_THRESHOLD / `
                + `NOVA_SPEAKER_MARGIN, restart the backend, press Check again.`);
      const box = $("#proflist"); box.innerHTML = "";
      if (!pr.profiles.length) box.appendChild(el("div","dim","No profiles enrolled."));
      pr.profiles.forEach(p => {
        const row = el("div", null,
          `<span class="pill">${p.role}</span> <b>${p.name||p.display_name}</b> `
          + `<span class="dim">${p.profile_id} · ${p.sample_count} samples · ${p.status||""}</span> `);
        const d = el("button","danger","Delete");
        d.onclick = async () => {
          const dep = dependentEvidence(S, p.profile_id);
          const warn = dep.length
            ? `\n\nThis will also DISCARD evidence measured against that profile:\n`
              + `  ${dep.join("\n  ")}\n\nThose scores were computed against this `
              + `centroid and cannot be relabelled.`
            : "";
          if (!confirm(`Delete ${p.name||p.display_name}?${warn}`)) return;
          await api("/speaker/profiles/"+p.profile_id, {method:"DELETE"});
          // Reconcile the BROWSER too. Deleting on the backend while leaving the
          // old trial rows in localStorage is exactly how one run ended up with
          // 56 trials scored against centroids that no longer existed.
          invalidateForProfile(S, p.profile_id);
          save();
          $("#ping").click();
        };
        row.appendChild(d);
        box.appendChild(row);
      });
    } catch (e) { out.innerHTML = `<span class="bad">${e.message}</span>`; }
  };
  render();
}
</script>
