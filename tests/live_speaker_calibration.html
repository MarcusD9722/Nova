<!doctype html>
<meta charset="utf-8">
<title>Nova — Speaker Calibration (V3 P5.2)</title>
<style>
  :root { --bg:#0e1116; --fg:#e6e9ef; --dim:#9aa4b2; --ok:#2ea043; --bad:#f85149;
          --warn:#d29922; --line:#232a35; --card:#161b22; --hot:#f85149; }
  body { background:var(--bg); color:var(--fg); font:15px/1.55 system-ui,sans-serif;
         margin:0; padding:28px; max-width:920px; }
  h1 { font-size:20px; margin:0 0 4px; } h2 { font-size:16px; margin:22px 0 8px; }
  .dim { color:var(--dim); } .ok { color:var(--ok); } .bad { color:var(--bad); }
  .warn { color:var(--warn); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:16px; margin:12px 0; }
  button { background:#21262d; color:var(--fg); border:1px solid var(--line);
           border-radius:7px; padding:9px 14px; font-size:14px; cursor:pointer; }
  button:hover:not(:disabled) { border-color:#3d4756; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button.primary { background:#1f6feb; border-color:#1f6feb; }
  button.danger { background:#4a1d1d; border-color:#6e2b2b; }
  input { background:#0d1117; color:var(--fg); border:1px solid var(--line);
          border-radius:6px; padding:8px; font-size:14px; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th,td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); }
  pre { background:#0d1117; border:1px solid var(--line); border-radius:8px;
        padding:12px; overflow:auto; font-size:12px; max-height:340px; }
  .step { opacity:.35; pointer-events:none; }
  .step.active { opacity:1; pointer-events:auto; }
  .step.done { opacity:.7; pointer-events:auto; }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px;
          border:1px solid var(--line); font-size:12px; margin-right:6px; }
  .bar { height:6px; background:#0d1117; border-radius:3px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--ok); transition:width .2s; }

  /* ── the guided stage: one card that drives the whole run ─────────────── */
  #stage { position:sticky; top:0; z-index:20; background:var(--card);
           border:1px solid var(--line); border-radius:12px; padding:18px;
           margin:12px 0; display:none; }
  #stage.on { display:block; }
  #stage.rec { border-color:var(--hot); box-shadow:0 0 0 1px var(--hot) inset; }
  .who { font-size:13px; letter-spacing:.14em; text-transform:uppercase;
         color:var(--dim); }
  .cue { font-size:23px; line-height:1.32; margin:8px 0 4px; font-weight:600; }
  .state { font-size:15px; margin-top:10px; min-height:22px; }
  .count { font-size:52px; font-weight:700; line-height:1.05; margin:6px 0; }
  .meta { display:flex; gap:18px; flex-wrap:wrap; font-size:12.5px;
          color:var(--dim); margin-top:12px; }
  .ctrls { margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; }
  .banner { border:1px solid var(--line); border-left:4px solid #1f6feb;
            border-radius:10px; padding:18px; margin:12px 0; background:var(--card); }
  .banner h3 { margin:0 0 6px; font-size:18px; }
</style>

<h1>Nova speaker calibration</h1>
<p class="dim">
  V3 P5.2 · turns the provisional 0.55 / 0.10 into measured numbers.
  Needs <b>Marcus</b> and <b>one other real person</b> — the guest is only needed
  from step 4 onward. Nothing here records audio to disk: samples are decoded,
  embedded and discarded.
</p>

<div class="card">
  <label>Backend <input id="base" size="28" value="http://localhost:8008"></label>
  <label style="margin-left:12px">API token <input id="tok" size="20" placeholder="if set"></label>
  <button id="ping">Check</button>
  <div id="pingout" class="dim" style="margin-top:8px"></div>
</div>

<div id="stage"></div>
<div id="steps"></div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// PART 1 — PURE LOGIC.  No DOM, no network, no timers.
//
// Everything that decides WHAT gets recorded, HOW it is labelled, and WHETHER
// the run passes lives here, so tests/test_calibration_harness_v52.py can
// execute it under node and assert on real behaviour instead of grepping the
// source. A UX rewrite is exactly the kind of change that can silently drop a
// sample, mislabel a speaker, or reuse calibration audio for validation, and
// none of those are visible in a screenshot.
// ═══════════════════════════════════════════════════════════════════════════

// ── recording windows ───────────────────────────────────────────────────────
// MediaRecorder records a FIXED window, so the prompt has to fit inside it —
// a shorter window with the old long phrases would simply truncate speech
// mid-word and hand ECAPA a clipped sample. The phrases below were shortened
// to match. Backend floors: enrollment 1.5s (matcher.MIN_SAMPLE_S), command
// 1.0s (backend.MIN_SPEECH_S); 3.0s keeps a 2x margin over the stricter one
// rather than operating near it.
const DUR = {
  enroll: 3.0,
  trial: 3.0,
  validation: 3.0,
  permission: 3.0,
  latency: 2.5,       // OFF and ON identical, so the delta stays a fair test
  sentinelStore: 5.0, // NOT shortened: the phrase carries a sentinel token
  sentinelAsk: 4.0,
};

//: Gap between a processed sample and the next countdown. Long enough to draw
//: breath, short enough that 107 recordings do not become an afternoon.
const GAP_MS = 800;
const LEAD_IN_S = 3;   // 3-2-1 at the start of a block
const LEAD_NEXT_S = 1; // between samples inside a block

const CONDITION_NAMES = ["normal", "quiet", "loud", "near", "far"];
const CONDITION_HINT = {
  normal: "normal speaking voice",
  quiet:  "quieter than normal, but not whispering",
  loud:   "louder than normal, as if across a room",
  near:   "close to the microphone",
  far:    "further back than usual",
};

// Six short read phrases. Each is ~8 words / ~2.5s, so a 3.0s window captures
// all of it with headroom.
const ENROLL_PHRASES = [
  "Blue umbrellas dry slowly on the front porch.",
  "Seven trucks passed the old stone bridge today.",
  "My coffee went cold while I was reading.",
  "The garage light flickers almost every evening.",
  "She packed thirty books into two small boxes.",
  "Warm rain fell across the empty quiet street.",
];

// Trials must be FRESH natural speech, never an enrollment phrase — reusing one
// would inflate the genuine distribution and the fitted threshold would be
// measuring how well someone repeats themselves. These two pools are
// deliberately DISJOINT so calibration audio can never become validation audio.
const CAL_CUES = [
  "Name three things you can see right now.",
  "Say what you ate most recently.",
  "Describe the weather outside in one sentence.",
  "Count backwards from twenty down to fourteen.",
  "Say the days of the week, starting Wednesday.",
  "Name four colours you like.",
  "Say where you went last weekend.",
  "Describe the room you are sitting in.",
  "Name three cities you have visited.",
  "Say what you plan to do tomorrow.",
  "List four things in your kitchen.",
  "Say one sentence about your favourite meal.",
];
const VAL_CUES = [
  "Name three animals with four legs.",
  "Say two things you did this morning.",
  "Count from thirty-one up to thirty-eight.",
  "Name four items of clothing.",
  "Say one sentence about music you like.",
  "Describe your favourite season briefly.",
  "Name three tools you have used.",
  "Say what time you usually wake up.",
  "List four kinds of fruit.",
  "Say a short sentence about travel.",
];

//: Honest non-identifications. `known` is NOT here: if the third speaker comes
//: back recognised, the privacy question was never asked.
const UNVERIFIED_OK = ["unknown", "ambiguous", "unavailable", "too_short"];

//: Bump whenever step 9's protocol changes in a way that invalidates earlier
//: evidence. localStorage keeps `S.sentinel`, so without this a PASS produced
//: by an older, flawed step 9 would be loaded by newer code and satisfy
//: acceptance without ever being re-run. Old or missing revision can never pass.
const STEP9_EVIDENCE_REVISION = "p52-step9-atomic-v1";

/** Even, deterministic spread across the five acoustic conditions — GROUPED.
 *
 *  20 -> exactly 4 each, which is what P5.2 requires for Phase A.
 *
 *  Grouped, not round-robin. Round-robin preserves the counts but makes a human
 *  physically move toward and away from the microphone on every single sample,
 *  which is slower and produces worse `near`/`far` audio than settling into a
 *  position for four takes. The counts are identical either way; only the human
 *  cost differs, and that is the whole point of this workflow.
 */
function planConditions(count, conds) {
  conds = conds || CONDITION_NAMES;
  const per = Math.floor(count / conds.length);
  const extra = count % conds.length;
  const out = [];
  conds.forEach((c, idx) => {
    const n = per + (idx < extra ? 1 : 0);
    for (let k = 0; k < n; k++) out.push(c);
  });
  return out;
}

// ── the sentinel tokens ─────────────────────────────────────────────────────
//
// Human run 2 failed step 9 with marcus_got_own=false AND guest_got_own=false,
// while both negative privacy checks "passed" — which they do vacuously when
// nobody receives anything. The production path was then verified end to end
// and is correct: each speaker's prompt carries their own sentinel and not the
// other's, from separately-keyed conversation state.
//
// The old tokens were MARCUS-LIVE-551 / GUEST-LIVE-661, compared with exact
// `reply.includes(...)`. But this is a VOICE pipeline: the store utterance goes
// through STT before it is ever stored, and STT will happily render a
// hyphenated, digit-bearing token as "Marcus live 551". The model then answers
// with what it was given, and an exact string test reports a memory failure
// that never happened.
//
// So: letter-only, three-word, phonetically distinct phrases that STT can
// transcribe without inventing punctuation, and a canonicalizing comparison.
// Human run 2 proved that no predetermined phrase is a reliable oracle:
// ORCHARD -> ORCHID, HARBOR -> HARBOUR, "sentinel" -> "sensor". Chasing
// STT-safe words is unwinnable, and adding ORCHID/HARBOUR aliases would only
// paper over whichever word breaks next.
//
// So the CUE is only a prompt for the human. The EXPECTED ANSWER is whatever
// STT actually decoded, because that is what /chat received and therefore all
// Nova could possibly remember. This separates STT quality — not what step 9
// measures — from speaker-scoped memory attribution, which is.
const SENTINELS = {
  marcus: "BLUE TIGER SPOON",
  guest:  "GREEN ROCKET CHAIR",
};

//: Words that mean the parse grabbed the carrier phrase instead of the payload.
const CANARY_STOPWORDS = ["REMEMBER", "THESE", "THREE", "WORDS", "THE", "ARE",
                          "IS", "AND", "A", "AN", "MY"];

/**
 * Pull the three remembered words out of a REAL /stt transcript.
 *
 * Anchors on the carrier phrase ("...three words: X Y Z"), falling back to the
 * last three tokens when STT drops the anchor. Returns null when it cannot get
 * a clean three-token payload — the caller must then FAIL that store sample and
 * re-record it rather than guess, because a wrong expected answer would fail
 * the memory test for a transcription reason all over again.
 */
function extractCanary(sttText) {
  const t = canonTokens(sttText);
  const at = t.lastIndexOf("WORDS");
  let picked;
  if (at >= 0) {
    picked = t.slice(at + 1, at + 4);          // the payload after the anchor
  } else if (t.length === 3) {
    // FAIL CLOSED. Without the anchor, accept only when the ENTIRE transcript
    // is the three words. Taking the last three tokens of an arbitrary longer
    // sentence would happily "extract" a canary from "...so I went to the shop
    // yesterday", and the run would then be measured against nonsense.
    picked = t;
  } else {
    return null;
  }
  if (picked.length !== 3) return null;
  if (picked.some(w => w.length < 2)) return null;
  if (picked.some(w => CANARY_STOPWORDS.indexOf(w) >= 0)) return null;
  if (new Set(picked).size !== 3) return null;     // "blue blue tiger" is a misparse
  return picked.join(" ");
}

// ── ONE source of truth for the ask ─────────────────────────────────────────
//
// The cue shown to the human and the validator that accepts their transcript
// MUST be the same contract. They were not: the displayed cue was "What three
// words did I ask you to remember?", which contains no MY, while the validator
// required MY + THREE + WORDS. A PERFECT transcription of the printed
// instruction was rejected before /chat, forever — a guaranteed live deadlock
// that 99/99 green tests never saw, because the validator was only ever tested
// against phrases invented alongside it rather than against the real cue.
//
// So the utterance is defined once, the cue is derived from it, and a
// regression asserts the real thing passes the real validator.
const ASK_UTTERANCE = "Repeat my three words.";

//: The ASK must also be transcribed recognisably, or the turn tests Whisper
//: rather than memory. Deterministic and strict: a first-person recall request
//: for the three words. No classifier, no model call, no fuzzy matching.
const ASK_PATTERNS = [
  ["REPEAT", "MY", "THREE", "WORDS"],
  ["WHAT", "ARE", "MY", "THREE", "WORDS"],
  ["WHAT", "WERE", "MY", "THREE", "WORDS"],
  ["SAY", "MY", "THREE", "WORDS"],
  ["TELL", "ME", "MY", "THREE", "WORDS"],
];

/** Is this transcript recognisably "repeat my three words"? */
function isAskTranscript(sttText) {
  const t = canonTokens(sttText);
  if (!t.length) return false;
  // Every pattern must appear as an in-order subsequence, AND the essential
  // tokens must all be present — so "what are my words" (no THREE) is rejected
  // rather than nearly-accepted.
  if (t.indexOf("THREE") < 0 || t.indexOf("WORDS") < 0) return false;
  if (t.indexOf("MY") < 0) return false;      // first-person; not "your words"
  return ASK_PATTERNS.some(pat => {
    let i = 0;
    for (const tok of t) { if (tok === pat[i]) i++; if (i === pat.length) return true; }
    return false;
  });
}

/** Uppercase alphanumeric tokens. Deterministic; no fuzzy or semantic matching. */
function canonTokens(s) {
  return String(s == null ? "" : s)
    .toUpperCase().replace(/[^A-Z0-9]+/g, " ").trim()
    .split(/\s+/).filter(Boolean);
}

/**
 * Does `reply` contain `sentinel` as a consecutive run of identical tokens?
 *
 * Case, punctuation and whitespace are ignored; WORDS ARE NOT. A missing token
 * ("COBALT ORCHARD"), a substituted one ("COBALT ORCHARD LIME") and the other
 * speaker's phrase all fail. No edit distance, no fuzzy matching — a near-miss
 * is a miss.
 *
 * THE SAME function backs the positive checks (did Marcus get his own?) and the
 * negative privacy checks (did the guest get Marcus's?). Normalising only the
 * positives would make the test easier to pass while making leaks harder to
 * see, which is the wrong trade in both directions at once.
 */
function containsSentinel(reply, sentinel) {
  const r = canonTokens(reply), s = canonTokens(sentinel);
  if (!s.length || !r.length || r.length < s.length) return false;
  for (let i = 0; i < r.length; i++) {
    let ri = i, si = 0;
    while (si < s.length && ri < r.length) {
      if (r[ri] === s[si]) { ri++; si++; }
      // ONE deterministic concession to grammar: a natural answer is "blue,
      // tiger, AND spoon". `AND` is skipped only BETWEEN expected words, never
      // at the start or end, and never in place of one. Word identity and
      // order stay exact — this is not fuzzy matching and admits no wrong word.
      else if (r[ri] === "AND" && si > 0 && si < s.length) { ri++; }
      else break;
    }
    if (si === s.length) return true;
  }
  return false;
}

// ── who speaks, in the two multi-person blocks ──────────────────────────────
// Pure data so the handoff rule below can be tested without a browser.
//: Derived, never written out separately — see ASK_UTTERANCE above.
const ASK_CUE = `say — "${ASK_UTTERANCE}"`;
const SENTINEL_STEPS = [
  {who:"Marcus", phase:"store", secs:5.0, canaryFor:"marcus",
   cue:`Marcus: say — "Remember these three words: ${SENTINELS.marcus}."`},
  {who:"Guest", phase:"store", secs:5.0, canaryFor:"guest",
   cue:`Guest: say — "Remember these three words: ${SENTINELS.guest}."`},
  {who:"Marcus", phase:"ask", secs:4.0, cue:`Marcus: ${ASK_CUE}`},
  {who:"Guest", phase:"ask", secs:4.0, cue:`Guest: ${ASK_CUE}`},
  // `who` is the identity KEY the result analysis matches on; `label` is what a
  // human is shown. Keeping them separate stops a wording change from silently
  // breaking `steps.find(s => s.who === "unverified")`.
  {who:"unverified", label:"a third, unenrolled person", phase:"ask", secs:4.0,
   cue:`A THIRD, unenrolled person: ${ASK_CUE}`},
];

const PERMISSION_STEPS = [
  {who:"Marcus", secs:3.0}, {who:"Guest", secs:3.0},
];

/** Display name for a step. */
function stepLabel(step) { return (step && (step.label || step.who)) || ""; }

// ── profile GENERATION ──────────────────────────────────────────────────────
//
// A profile id names a CENTROID. Delete and re-enrol and the new profile has a
// new id and a different centroid, so every similarity score measured against
// the old one is evidence about a voice model that no longer exists.
//
// A live run mixed two generations: 56 calibration trials scored against
// spk-601053c258fa / spk-c96353f36365, 20 validation trials against the current
// spk-ccc5aafb945f / spk-4ebf6e6c6135. The browser happily computed and applied
// a calibration from the old scores. Nothing in the harness noticed, because
// nothing was watching the ids.
//
// So every piece of evidence now carries the generation it was measured under,
// and anything that consumes it checks first.
// THE INVARIANT IS ABOUT CENTROIDS, NOT POPULATION SIZE.
//
// The first attempt at this compared the whole compatible-profile set and
// treated any change as staleness. That deadlocked a PERFECTLY CLEAN run: the
// P5.2 protocol deliberately grows the population halfway through —
//
//     steps 3-4  Phase A      only Marcus is enrolled; the guest records 12
//                             utterances as an UNENROLLED impostor, scored
//                             against Marcus's centroid alone
//     step 5     the guest is enrolled  {M} -> {M, G}
//     step 6     Phase B      12 + 12, now scored against both
//
// so `trialsGeneration` ({M}) could never match the current set ({M,G}) and
// step 6 was unreachable.
//
// The real rule is the one that was always meant: NO SCORE MAY DEPEND ON A
// CENTROID THAT HAS BEEN DELETED OR REPLACED. Adding a profile invalidates
// nothing. Replacing one invalidates exactly the evidence scored against it.
//
// So each block records the centroids its scores were measured against, and the
// model build. Phase A honestly records {M} — the audio was never scored
// against a guest centroid, and relabelling the impostor rows' TRUTH once the
// guest is enrolled does not change what they were scored against.
function buildOf(status) {
  const m = (status && status.model_id) || "";
  const r = (status && status.model_revision) || "";
  return `${m}@${r}`;
}

function compatibleIds(profiles) {
  return (profiles || []).filter(p => p.compatible !== false)
                         .map(p => p.profile_id).sort();
}

/** Record which centroids a block's scores were measured against. */
function recordLineage(S, blockId, centroidIds, build) {
  S.lineage = S.lineage || {};
  S.lineage[blockId] = {build, centroids: (centroidIds || []).slice().sort()};
  return S.lineage[blockId];
}

/**
 * Which recorded blocks depended on a centroid that is now gone (or a different
 * model build). Empty when every score still refers to something that exists.
 */
function staleLineage(S, currentIds, build) {
  const present = new Set(currentIds || []);
  const bad = [];
  const lineage = S.lineage || {};
  Object.keys(lineage).forEach(blockId => {
    const lin = lineage[blockId] || {};
    if (build && lin.build && lin.build !== build) {
      bad.push({block: blockId, why: `model build changed `
                                   + `(${lin.build} -> ${build})`});
      return;
    }
    const gone = (lin.centroids || []).filter(id => !present.has(id));
    if (gone.length) {
      bad.push({block: blockId, missing: gone,
                why: `scored against centroid(s) that no longer exist: `
                   + gone.join(", ")});
    }
  });
  return bad;
}

/** What would be discarded if this profile went away. For the confirm dialog. */
function dependentEvidence(S, profileId) {
  const out = [];
  const touches = rows => (rows || []).some(r =>
    r.truth === profileId || r.top_profile_id === profileId
    || r.second_profile_id === profileId || r.predicted_profile_id === profileId);
  if (S.marcusId === profileId) out.push("Marcus enrolment");
  if (S.guestId === profileId) out.push("guest enrolment");
  if (touches(S.trials)) out.push(`${S.trials.length} calibration trials`);
  if (touches(S.validation)) out.push(`${S.validation.length} validation trials`);
  if (S.proposal) out.push("proposed calibration");
  if (S.applied) out.push("applied calibration");
  if (S.sentinel) out.push("step 9 memory attribution");
  if (S.permission) out.push("permission regression");
  if (S.sttLatency) out.push("latency measurement");
  return out;
}

/**
 * Drop every piece of browser evidence whose scores depended on this profile.
 *
 * Correctness beats resume: a trial row whose top/second scores were computed
 * against a deleted centroid is not evidence about anything that still exists.
 * Earlier, genuinely independent progress is left alone.
 */
function invalidateForProfile(S, profileId) {
  const dropped = [];
  const touches = r => r.truth === profileId || r.top_profile_id === profileId
                    || r.second_profile_id === profileId
                    || r.predicted_profile_id === profileId;
  if ((S.trials || []).some(touches)) {
    S.trials = []; dropped.push("trials");
    delete S.blocks.trials_marcus; delete S.blocks.trials_guest;
    delete S.blocks.phaseb_marcus; delete S.blocks.phaseb_guest;
  }
  if ((S.validation || []).some(touches)) {
    S.validation = []; dropped.push("validation");
    delete S.blocks.valid_marcus; delete S.blocks.valid_guest;
  }
  // The fit, and everything downstream of it, described the old population.
  S.proposal = null; S.applied = false;
  // Drop the lineage of every block whose centroid is gone.
  Object.keys(S.lineage || {}).forEach(b => {
    if ((S.lineage[b].centroids || []).indexOf(profileId) >= 0) delete S.lineage[b];
  });
  S.statusAfter = null;
  S.sentinel = null; S.sentinelConversationId = null;
  S.permission = null;
  S.sttLatency = null; S.latencySamples = {off:[], on:[]};
  delete S.blocks.sentinel; delete S.blocks.permission; delete S.blocks.latency;
  if (S.marcusId === profileId) {
    S.marcusId = null; if (S.enroll) S.enroll.marcus = null;
    delete S.blocks.enroll_marcus; dropped.push("Marcus enrolment");
  }
  if (S.guestId === profileId) {
    S.guestId = null; if (S.enroll) S.enroll.guest = null;
    delete S.blocks.enroll_guest; dropped.push("guest enrolment");
  }
  // Step back to the earliest phase whose evidence still stands.
  S.step = Math.min(S.step, S.marcusId ? (S.trials.length ? 2 : 2) : 1);
  return dropped;
}

/** Ids actually referenced by stored trial rows — the ground truth, not a tag. */
function idsReferencedBy(rows) {
  const seen = new Set();
  (rows || []).forEach(r => {
    [r.truth, r.top_profile_id, r.second_profile_id, r.predicted_profile_id]
      .forEach(v => { if (v && v !== "__impostor__") seen.add(v); });
  });
  return [...seen].sort();
}

// ── the effective-policy question, asked in exactly one place ───────────────
//
// `threshold_calibrated` only means a valid RECORD covers the profiles.
// NOVA_SPEAKER_THRESHOLD / NOVA_SPEAKER_MARGIN silently outrank it, so a run
// can be "calibrated" while every decision is made by an env override. Apply,
// the Check button, the step 8 and step 9 preflights and acceptance all ask
// through here, so they cannot drift apart.
function calibratedPolicyStatus(st) {
  return !!(st
            && st.threshold_calibrated === true
            && st.threshold_source === "calibrated"
            && st.margin_source === "calibrated");
}

/** Why the policy is not calibrated, for a human. Empty when it is. */
function policyProblem(st) {
  if (!st) return "no /speaker/status has been fetched yet — press Check";
  const bad = [];
  if (st.threshold_calibrated !== true) bad.push("threshold_calibrated is not true");
  if (st.threshold_source !== "calibrated")
    bad.push(`threshold_source is "${st.threshold_source}"`);
  if (st.margin_source !== "calibrated")
    bad.push(`margin_source is "${st.margin_source}"`);
  return bad.join("; ");
}

// ── mandatory-gate prerequisites ────────────────────────────────────────────
// A failed gate leaves its diagnostics on screen but must not let the run
// continue past it. Pure predicates so the UI and the tests agree.
function step9Ready(S) {
  return !!(S && S.marcusId && S.guestId
            && S.enroll && S.enroll.marcus && S.enroll.marcus.meets_p52_bar
            && S.enroll.guest && S.enroll.guest.meets_p52_bar
            && S.applied && S.validation && S.validation.length > 0);
}
function step9Passed(S) {
  return !!(S && S.sentinel && S.sentinel.pass === true
            && S.sentinel.evidence_revision === STEP9_EVIDENCE_REVISION);
}
function step10Ready(S) { return step9Passed(S); }
function step10Passed(S) { return !!(S && S.permission && S.permission.pass === true); }
function step11Ready(S) { return step10Passed(S); }

//: Thrown once /chat has been dispatched. The backend may already have recorded
//: the turn, so the client cannot prove zero side effects — the conversation is
//: no longer clean and the whole run must be abandoned rather than retried.
function PostChatError(message) {
  const e = new Error(message);
  e.postChat = true;
  return e;
}

/**
 * One sentinel sample, with its dependencies injected.
 *
 * Extracted from the flow so tests can supply fake `sttTurn`/`chatFromStt` and
 * COUNT the calls. Structural assertions ("the source contains one await") are
 * not the same claim as "one call happened", and the ask-cue deadlock is what
 * that difference costs.
 *
 * The commit boundary covers EVERYTHING after dispatch, not just the HTTP call:
 * once /chat has gone out, a failure in the bookkeeping below is still a dirty
 * conversation, and retrying the sample would build the rest of the run on top
 * of a turn the backend may already hold.
 */
function makeSentinelDoSample(deps, ctx) {
  return async function doSample(blob, i) {
    const spec = ctx.steps[i];

    // 1. TRANSCRIBE. No /chat yet.
    const s = await deps.sttTurn(blob);

    // 2. VALIDATE, still before /chat. A rejection costs one /stt and leaves
    //    the conversation untouched, so the sample may be retaken safely.
    let pendingCanary = null;
    if (spec.canaryFor) {
      pendingCanary = extractCanary(s.text);
      if (!pendingCanary) {
        throw new Error(`could not read three words from "${(s.text||"").slice(0,70)}" `
                      + `— nothing was sent to Nova; say the cue again, clearly`);
      }
    } else if (!isAskTranscript(s.text)) {
      throw new Error(`that did not transcribe as "${ASK_UTTERANCE}" `
                    + `("${(s.text||"").slice(0,70)}") — nothing was sent to Nova; `
                    + `say it again`);
    }

    // 3. COMMIT. Everything from here is inside the post-dispatch boundary.
    let committed = false;
    try {
      const r = await deps.chatFromStt(s, ctx.CID);
      committed = true;

      // A different or missing conversation id is an INTEGRITY failure, not a
      // flag to note and carry on: the turn landed somewhere this run does not
      // control, so recording the remaining speakers would be meaningless.
      if (r.conversation_id !== ctx.CID) {
        ctx.out.conversation_stable = false;
        throw PostChatError(
          `backend returned conversation ${r.conversation_id} instead of ${ctx.CID}`);
      }

      if (pendingCanary) ctx.observed[spec.canaryFor] = pendingCanary;
      ctx.replies[i] = r.reply;
      ctx.out.steps.push({
        who: spec.who, phase: spec.phase,
        status: r.speaker && r.speaker.status || null,
        name: r.speaker && r.speaker.display_name || null,
        profile_id: r.speaker && r.speaker.profile_id || null,
        conversation_id: r.conversation_id,
        stt_text: r.text != null ? r.text : null,
        assistant_reply: r.reply != null ? r.reply : null,
        stt_tokens: canonTokens(r.text).join(" "),
        reply_tokens: canonTokens(r.reply).join(" "),
        observed_canary: spec.canaryFor ? ctx.observed[spec.canaryFor] : null,
        got_marcus: containsSentinel(r.reply, ctx.observed.marcus),
        got_guest: containsSentinel(r.reply, ctx.observed.guest),
      });
      return {note: `${spec.who}: ${(r.speaker && r.speaker.status) || "?"}`};
    } catch (e) {
      // Bookkeeping blew up AFTER dispatch. Promote it: the run must abort.
      if (committed && !e.postChat) {
        throw PostChatError(`post-chat processing failed: ${e.message}`);
      }
      throw e;
    }
  };
}

/** Who must take over before sample `i`, or null if the speaker is unchanged.
 *
 *  Both multi-person blocks record automatically WITHIN one speaker, but a
 *  change of human is not something to spring on a room mid-countdown: the
 *  wrong person answers, the turn is attributed to them, and the privacy or
 *  permission result is quietly meaningless. Every change gets a deliberate
 *  Continue.
 */
function handoffBeforeIndex(steps, i) {
  if (!steps || i <= 0 || i >= steps.length) return null;
  return steps[i].who !== steps[i-1].who ? steps[i].who : null;
}

/** Rotate through a cue pool. Separate pools per phase keep the audio fresh. */
function cueFor(pool, i) { return pool[i % pool.length]; }

/** The whole run, as data. Counts here ARE the statistical evidence — they are
 *  unchanged from the pre-UX-rewrite protocol and must stay that way. */
function blockPlan() {
  return [
    {id:"enroll_marcus", step:2,  who:"Marcus", kind:"enroll",     count:6,  seconds:DUR.enroll},
    {id:"trials_marcus", step:3,  who:"Marcus", kind:"trial",      count:20, seconds:DUR.trial,      phase:"A"},
    {id:"trials_guest",  step:4,  who:"Guest",  kind:"trial",      count:12, seconds:DUR.trial,      phase:"A"},
    {id:"enroll_guest",  step:5,  who:"Guest",  kind:"enroll",     count:6,  seconds:DUR.enroll},
    {id:"phaseb_marcus", step:6,  who:"Marcus", kind:"trial",      count:12, seconds:DUR.trial,      phase:"B"},
    {id:"phaseb_guest",  step:6,  who:"Guest",  kind:"trial",      count:12, seconds:DUR.trial,      phase:"B"},
    {id:"valid_marcus",  step:8,  who:"Marcus", kind:"validation", count:10, seconds:DUR.validation, phase:"V"},
    {id:"valid_guest",   step:8,  who:"Guest",  kind:"validation", count:10, seconds:DUR.validation, phase:"V"},
    {id:"sentinel",      step:9,  who:"mixed",  kind:"sentinel",   count:5,  seconds:DUR.sentinelAsk},
    {id:"permission",    step:10, who:"mixed",  kind:"permission", count:2,  seconds:DUR.permission},
    {id:"latency",       step:11, who:"either", kind:"latency",    count:12, seconds:DUR.latency},
  ];
}

function totalRecordings(plan) {
  return (plan || blockPlan()).reduce((n, b) => n + b.count, 0);
}

/** Where a trial is stored. Validation NEVER shares storage with calibration:
 *  the fit must not be able to see the audio it will later be judged on. */
function storeFor(phase) { return phase === "V" ? "validation" : "trials"; }

// ── enrollment is deliberately NOT resumable ────────────────────────────────
//
// Trials are safe to resume: each one is uploaded and scored the moment it is
// recorded, so `S.blocks[id].done` and the stored rows describe the same thing.
//
// Enrollment is not. Its six clips are held as in-memory Blobs until all six
// exist and go up in ONE multipart request — and audio is never persisted, by
// design. So a Stop or a refresh at 3/6 destroys three recordings while leaving
// `done: 3` on disk. Resuming would record only three more and upload a
// half-enrollment while the UI showed 6/6. The count would be a lie about audio
// that no longer exists.
//
// The fix is not to persist the audio. It is to refuse to resume.
const ENROLL_BLOCKS = {enroll_marcus:"marcus", enroll_guest:"guest"};

/** Did the SERVER actually complete this enrollment? Block progress is only
 *  meaningful once the upload succeeded and a profile came back. */
function enrollmentComplete(e) { return !!(e && e.ok && e.profile_id); }

/** Complete AND at the P5.2 bar. Only this may advance the protocol. */
function enrollmentAcceptable(e) {
  return enrollmentComplete(e) && e.meets_p52_bar === true;
}

/** Run at load: drop enrollment progress whose audio cannot exist any more.
 *  Returns the block ids that were reset, so the human is TOLD rather than
 *  quietly restarted. */
function reconcileEnrollment(S) {
  const reset = [];
  Object.keys(ENROLL_BLOCKS).forEach(blockId => {
    const done = (S.blocks[blockId] || {}).done || 0;
    if (done > 0 && !enrollmentComplete((S.enroll || {})[ENROLL_BLOCKS[blockId]])) {
      S.blocks[blockId] = {done: 0};
      reset.push(blockId);
    }
  });
  return reset;
}

/** ONE state transition per processed sample.
 *
 *  The row and the block index must become durable together. Previously the row
 *  was pushed and saved inside the sample handler, and the index was incremented
 *  and saved after it returned — a reload in between persisted the row with the
 *  index one behind, so resuming re-recorded an index that already had a row and
 *  the trial was counted twice. Both changes now happen here, and exactly one
 *  save follows.
 */
function commitSample(S, {blockId, nextIndex, row, store}) {
  if (row) (store === "validation" ? S.validation : S.trials).push(row);
  S.blocks[blockId] = {done: nextIndex};
  return S;
}

/** The advance rule, isolated so it can be proven.
 *  Only a genuinely processed sample moves the index; a retry or an error
 *  repeats the SAME index, so nothing is skipped and nothing is double-counted. */
function advance(i, outcome) { return outcome === "ok" ? i + 1 : i; }

/** Recognition accuracy is about what Nova ASSERTED — predicted_profile_id,
 *  never top_profile_id, which is only a ranking. */
function confusion(rows) {
  const m = {swap:0, correct:{}, total:{}, unknown:0, ambiguous:0};
  rows.forEach(r => {
    m.total[r.truthName] = (m.total[r.truthName]||0)+1;
    if (r.status === "known") {
      if (r.predicted_profile_id === r.truth) m.correct[r.truthName]=(m.correct[r.truthName]||0)+1;
      else m.swap++;
    } else if (r.status === "ambiguous") m.ambiguous++;
    else m.unknown++;
  });
  return m;
}

function pct(a, q) {
  if (!a || !a.length) return null;
  const s = a.slice().sort((x,y)=>x-y);
  return s[Math.max(0, Math.min(s.length-1, Math.round(q*(s.length-1))))];
}

/** Every stored row must carry the block it came from, and that block's
 *  declared speaker must match the truth id it was filed under. This is the
 *  guard against a handoff error labelling the guest's audio as Marcus. */
function auditTruth(rows, marcusId, guestId) {
  const bad = [];
  (rows||[]).forEach((r, i) => {
    if (!r.block) { bad.push({i, why:"no block recorded"}); return; }
    const expect = r.block.indexOf("marcus") >= 0 ? marcusId
                 : r.block.indexOf("guest")  >= 0 ? guestId : null;
    // The unenrolled impostor block is relabelled once the guest has an id.
    if (expect && r.truth !== expect && r.truth !== "__impostor__") {
      bad.push({i, block:r.block, truth:r.truth, expected:expect});
    }
  });
  return {ok: bad.length === 0, mismatches: bad};
}

/** The complete P5.2 gate. Unchanged bars — this is a UX rewrite, and a faster
 *  workflow must not be a more permissive one. */
function computeAcceptance(S) {
  const recog = (S.validation && S.validation.length) ? confusion(S.validation) : null;
  const recogPass = !!(recog && recog.swap === 0
    && Object.keys(recog.total).every(n => (recog.correct[n]||0) / recog.total[n] >= 0.9));

  const compat = ((S.statusAfter && S.statusAfter.profiles_detail) || []).filter(p => p.compatible);
  const compatIds = compat.map(p => p.profile_id).sort();
  const wantIds = [S.marcusId, S.guestId].filter(Boolean).sort();
  const roleOf = id => (compat.find(p => p.profile_id === id) || {}).role || null;
  const twoProfiles = {
    compatible_count: compat.length, compatible_ids: compatIds, expected_ids: wantIds,
    marcus_role: roleOf(S.marcusId), guest_role: roleOf(S.guestId),
    exactly_two: compat.length === 2 && wantIds.length === 2
                 && JSON.stringify(compatIds) === JSON.stringify(wantIds),
    roles_correct: roleOf(S.marcusId) === "owner" && roleOf(S.guestId) === "guest",
  };
  twoProfiles.pass = twoProfiles.exactly_two && twoProfiles.roles_correct;

  const audit = auditTruth((S.trials||[]).concat(S.validation||[]), S.marcusId, S.guestId);

  // GENERATION. Every body of evidence must have been measured against the
  // profiles enrolled now. Checked from the ids the rows actually reference,
  // not only from the recorded tag — a tag can be right while the rows are not.
  const genWantIds = [S.marcusId, S.guestId].filter(Boolean).sort();
  const trialIds = idsReferencedBy(S.trials);
  const valIds = idsReferencedBy(S.validation);
  const generation = {
    expected_ids: genWantIds,
    trial_ids: trialIds, validation_ids: valIds,
    lineage: S.lineage || {},
    trials_ok: !trialIds.length
               || trialIds.every(id => genWantIds.indexOf(id) >= 0),
    validation_ok: !valIds.length
                   || valIds.every(id => genWantIds.indexOf(id) >= 0),
    // Every recorded block must still refer to centroids that exist. Adding a
    // profile is the designed progression and is NOT staleness.
    lineage_ok: staleLineage(S, genWantIds, null).length === 0,
  };
  generation.stale_blocks = staleLineage(S, genWantIds, null);
  generation.ok = generation.trials_ok && generation.validation_ok
                  && generation.lineage_ok;

  const plan = blockPlan();
  const need = {};
  plan.forEach(b => { need[b.id] = b.count; });
  const counts = {
    enroll_marcus: (S.enroll && S.enroll.marcus) ? (S.enroll.marcus.sample_count||0) : 0,
    trials_marcus: (S.trials||[]).filter(t => t.block === "trials_marcus").length,
    trials_guest:  (S.trials||[]).filter(t => t.block === "trials_guest").length,
    enroll_guest:  (S.enroll && S.enroll.guest) ? (S.enroll.guest.sample_count||0) : 0,
    phaseb_marcus: (S.trials||[]).filter(t => t.block === "phaseb_marcus").length,
    phaseb_guest:  (S.trials||[]).filter(t => t.block === "phaseb_guest").length,
    valid_marcus:  (S.validation||[]).filter(t => t.block === "valid_marcus").length,
    valid_guest:   (S.validation||[]).filter(t => t.block === "valid_guest").length,
  };

  const missing = [];
  if (!(S.enroll && S.enroll.marcus && S.enroll.marcus.meets_p52_bar)) missing.push("Marcus enrollment >=5 samples");
  if (!(S.enroll && S.enroll.guest && S.enroll.guest.meets_p52_bar)) missing.push("guest enrollment >=5 samples");
  if (counts.trials_marcus < need.trials_marcus) missing.push("Marcus phase A trials");
  if (counts.trials_guest < need.trials_guest) missing.push("unenrolled guest trials");
  if (counts.phaseb_marcus < need.phaseb_marcus) missing.push("Marcus phase B trials");
  if (counts.phaseb_guest < need.phaseb_guest) missing.push("guest phase B trials");
  if (!S.applied) missing.push("calibration applied");
  if (!(S.statusAfter && S.statusAfter.threshold_calibrated)) missing.push("status threshold_calibrated == true");
  if (!S.statusAfter) missing.push("post-run /speaker/status");
  // THE SAME helper Apply, Check and both preflights use. `threshold_calibrated`
  // only says a valid RECORD covers the profiles; NOVA_SPEAKER_THRESHOLD or
  // NOVA_SPEAKER_MARGIN silently outrank it, and validating steps 8-11 against
  // an env override would measure a policy nobody calibrated.
  if (S.statusAfter && !calibratedPolicyStatus(S.statusAfter))
    missing.push(`effective policy is not calibrated (${policyProblem(S.statusAfter)})`);
  if (counts.valid_marcus < need.valid_marcus) missing.push("Marcus validation");
  if (counts.valid_guest < need.valid_guest) missing.push("guest validation");
  if (!S.sentinel) missing.push("memory attribution");
  else if (S.sentinel.evidence_revision !== STEP9_EVIDENCE_REVISION)
    // Evidence from an older step-9 protocol. It cannot be trusted and cannot
    // be upgraded — it has to be re-run.
    missing.push(`memory attribution re-run (evidence is `
               + `"${S.sentinel.evidence_revision || "unversioned"}", `
               + `needs "${STEP9_EVIDENCE_REVISION}")`);
  if (!S.permission) missing.push("permission regression");
  if (!S.sttLatency) missing.push("latency measurement");
  // EXACTLY 6 + 6. "Some samples" is not the benchmark; a partial run would
  // give a P50/P95 nobody agreed to.
  else if (S.sttLatency.n_off !== 6 || S.sttLatency.n_on !== 6)
    missing.push(`latency needs exactly 6+6 (have ${S.sttLatency.n_off}+${S.sttLatency.n_on})`);

  const failed = [];
  if (recog && !recogPass) failed.push("recognition validation");
  if (S.sentinel && !S.sentinel.pass) failed.push("memory attribution");
  if (S.sentinel && !S.sentinel.conversation_stable) failed.push("sentinel conversation id not stable");
  if (S.sentinel && !S.sentinel.unverified_is_unverified) failed.push("third speaker was recognised — privacy check invalid");
  if (S.sentinel && S.sentinel.marcus_got_guest) failed.push("Marcus received the guest's canary");
  if (S.sentinel && S.sentinel.guest_got_marcus) failed.push("the guest received Marcus's canary");
  if (S.sentinel && S.sentinel.store_cross_leak) failed.push("a STORE reply disclosed the other speaker's canary");
  if (S.sentinel && S.sentinel.canaries_parsed === false) failed.push("a store canary never parsed");
  if (S.permission && !S.permission.pass) failed.push("permission regression");
  if (S.statusAfter && !twoProfiles.pass) failed.push("exactly-two-profile requirement");
  if (!audit.ok) failed.push("speaker/truth attribution mismatch");
  // The mixed-generation failure: evidence scored against centroids that no
  // longer exist can never become a PASS, and cannot be relabelled into one.
  if (!generation.trials_ok)
    failed.push(`calibration trials reference a stale profile generation `
              + `(${generation.trial_ids.join(", ")} vs ${genWantIds.join(", ")})`);
  if (!generation.validation_ok)
    failed.push(`validation trials reference a stale profile generation `
              + `(${generation.validation_ids.join(", ")} vs ${genWantIds.join(", ")})`);
  if (!generation.lineage_ok)
    failed.push("evidence was scored against centroids that no longer exist: "
              + generation.stale_blocks.map(b => b.block).join(", "));

  const acceptance = failed.length ? "FAIL" : (missing.length ? "NOT COMPLETE" : "PASS");
  return {recog, recogPass, twoProfiles, audit, generation, counts, missing,
          failed, acceptance};
}

function freshState() {
  return {
    step: 0, marcusId: null, guestId: null, trials: [], validation: [],
    enroll: {}, proposal: null, applied: false, latency: [],
    sentinel: null, permission: null, sttLatency: null, statusAfter: null,
    // ONE conversation for the whole sentinel run: /chat mints a fresh UUID per
    // call when none is sent, and five separate conversations cannot test
    // whether one person can read another's memory.
    sentinelConversationId: null,
    // Non-audio progress, so a refresh never costs completed utterances.
    blocks: {}, startedAt: null, paceMs: [], latencySamples: {off:[], on:[]},
    // Which CENTROIDS each recorded block's scores were measured against.
    // Keyed by block id; see recordLineage/staleLineage.
    lineage: {},
  };
}

const P52 = {
  DUR, GAP_MS, LEAD_IN_S, LEAD_NEXT_S, CONDITION_NAMES, CONDITION_HINT,
  ENROLL_PHRASES, CAL_CUES, VAL_CUES, UNVERIFIED_OK,
  SENTINEL_STEPS, PERMISSION_STEPS, ENROLL_BLOCKS, SENTINELS, CANARY_STOPWORDS,
  STEP9_EVIDENCE_REVISION, ASK_PATTERNS, ASK_UTTERANCE, ASK_CUE,
  canonTokens, containsSentinel, extractCanary, isAskTranscript,
  calibratedPolicyStatus, policyProblem, PostChatError, makeSentinelDoSample,
  buildOf, compatibleIds, recordLineage, staleLineage, idsReferencedBy,
  dependentEvidence, invalidateForProfile,
  step9Ready, step9Passed, step10Ready, step10Passed, step11Ready,
  planConditions, cueFor, blockPlan, totalRecordings, storeFor, advance,
  handoffBeforeIndex, stepLabel, enrollmentComplete, enrollmentAcceptable,
  reconcileEnrollment, commitSample,
  confusion, pct, auditTruth, computeAcceptance, freshState,
};
if (typeof module !== "undefined" && module.exports) module.exports = P52;
if (typeof globalThis !== "undefined") globalThis.P52 = P52;

// ═══════════════════════════════════════════════════════════════════════════
// PART 2 — BROWSER.  Everything below needs a DOM, a microphone and a backend.
// ═══════════════════════════════════════════════════════════════════════════
const HAS_DOM = typeof document !== "undefined";
//: Autosave is a convenience, not a requirement. Some contexts (an opaque
//: origin, a locked-down profile) throw on any localStorage access — and merely
//: TESTING for it throws too, which would abort the whole script and leave a
//: blank page. Probe it once, defensively, and degrade to a working harness
//: without resume rather than to nothing at all.
const CAN_SAVE = (() => {
  try { localStorage.setItem("nova.p52.probe", "1");
        localStorage.removeItem("nova.p52.probe"); return true; }
  catch { return false; }
})();

const $ = (s, r) => (r||document).querySelector(s);
const el = (t, c, h) => { const e=document.createElement(t); if(c)e.className=c;
                          if(h!==undefined)e.innerHTML=h; return e; };
const base = () => $("#base").value.replace(/\/$/, "");
const hdrs = () => { const t=$("#tok").value.trim();
                     return t ? {"X-API-Token": t} : {}; };

async function api(path, opts={}) {
  const r = await fetch(base()+path, {...opts, headers:{...hdrs(), ...(opts.headers||{})}});
  const txt = await r.text();
  let body; try { body = JSON.parse(txt); } catch { body = {raw:txt}; }
  if (!r.ok) throw new Error(body?.detail || body?.raw || ("HTTP "+r.status));
  return body;
}

const SAVE_KEY = "nova.p52.calibration.v3";
const S = (() => {
  if (!CAN_SAVE) return freshState();
  try { return JSON.parse(localStorage.getItem(SAVE_KEY) || "null") || freshState(); }
  catch { return freshState(); }
})();
function save() {
  if (CAN_SAVE) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch {} }
  render();
}
function reset() {
  if (CAN_SAVE) { try { localStorage.removeItem(SAVE_KEY); } catch {} }
  location.reload();
}

// ── recording ───────────────────────────────────────────────────────────────
let stream = null;
async function mic() {
  if (!stream) stream = await navigator.mediaDevices.getUserMedia({audio:true});
  return stream;
}
async function record(ms) {
  const s = await mic();
  const mr = new MediaRecorder(s, MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
    ? {mimeType:"audio/webm;codecs=opus"} : undefined);
  const chunks = [];
  mr.ondataavailable = e => e.data.size && chunks.push(e.data);
  const done = new Promise(res => mr.onstop = () => res(new Blob(chunks, {type: mr.mimeType||"audio/webm"})));
  mr.start(200);
  await sleep(ms);
  try { mr.stop(); } catch {}
  return await done;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ── the guided stage ────────────────────────────────────────────────────────
// Replaces the old click-per-utterance + alert() model. The human clicks once
// per BLOCK; every sample inside it counts down, records, uploads and advances
// on its own. alert() is gone entirely: it blocks the event loop, it cannot
// show progress, and 107 of them is not a workflow.
const RUN = { paused:false, retry:false, abort:false, active:false };

function stageEl() { return $("#stage"); }

function stageShow(html) {
  const st = stageEl(); st.className = "on"; st.innerHTML = html;
}
function stageHide() { const st = stageEl(); st.className = ""; st.innerHTML = ""; }

function fmtMs(ms) {
  if (ms == null || !isFinite(ms)) return "—";
  const s = Math.max(0, Math.round(ms/1000));
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
}

/** Overall counts, from what has actually been stored — not a hardcoded total. */
function progress() {
  const plan = blockPlan();
  const total = totalRecordings(plan);
  let done = 0;
  plan.forEach(b => { done += Math.min(b.count, (S.blocks[b.id]||{}).done || 0); });
  const paces = (S.paceMs||[]).slice(-25);
  const perSample = paces.length >= 3 ? pct(paces, .5) : null;
  const remaining = perSample != null ? (total - done) * perSample : null;
  return {done, total, remaining,
          elapsed: S.startedAt ? (Date.now() - S.startedAt) : 0};
}

function stageRender({who, title, cue, condition, state, big, blockDone, blockTotal, hot}) {
  const p = progress();
  const pctOverall = p.total ? Math.round(100 * p.done / p.total) : 0;
  const pctBlock = blockTotal ? Math.round(100 * blockDone / blockTotal) : 0;
  stageShow(`
    <div class="who">${who} · ${title}</div>
    ${condition ? `<div style="margin-top:6px"><span class="pill">${condition}</span>
       <span class="dim">${CONDITION_HINT[condition]||""}</span></div>` : ""}
    <div class="cue">${cue||""}</div>
    ${big ? `<div class="count">${big}</div>` : ""}
    <div class="state">${state||""}</div>
    <div style="margin-top:12px">
      <div class="dim" style="font-size:12.5px;margin-bottom:4px">
        this block ${blockDone||0} / ${blockTotal||0}</div>
      <div class="bar"><i style="width:${pctBlock}%"></i></div>
    </div>
    <div class="meta">
      <span><b>${p.done} / ${p.total}</b> recordings complete</span>
      <span>elapsed ${fmtMs(p.elapsed)}</span>
      <span>est. remaining ${p.remaining != null ? fmtMs(p.remaining) : "measuring…"}</span>
    </div>
    <div style="margin-top:6px"><div class="bar"><i style="width:${pctOverall}%"></i></div></div>
    <div class="ctrls">
      <button id="st-pause">${RUN.paused ? "Resume" : "Pause"}</button>
      <button id="st-retry">Retry this sample</button>
      <button id="st-abort" class="danger">Stop block</button>
    </div>
  `);
  if (hot) stageEl().classList.add("rec");
  $("#st-pause").onclick = () => { RUN.paused = !RUN.paused; };
  $("#st-retry").onclick = () => { RUN.retry = true; };
  $("#st-abort").onclick = () => { RUN.abort = true; };
}

/** A deliberate handoff. One click, on a full-width inline banner — NOT an
 *  alert(), and not once per utterance. */
function handoff(title, body, cta) {
  return new Promise(res => {
    stageShow(`<div class="who">next up</div>
      <div class="cue">${title}</div>
      <div class="state dim">${body}</div>
      <div class="ctrls"><button id="go" class="primary">${cta||"Continue"}</button></div>`);
    $("#go").onclick = () => res();
  });
}

async function waitWhilePaused(ctx) {
  while (RUN.paused && !RUN.abort) {
    stageRender({...ctx, state:'<span class="warn">paused</span>', big:"⏸"});
    await sleep(200);
  }
}

/**
 * Run one block of samples: countdown -> record -> process -> advance.
 *
 * `doSample` returns truthy on success. A throw, or a falsy return, repeats the
 * SAME index — a failed sample is never silently skipped, and never counted.
 */
async function runBlock(spec) {
  const {id, who, title, count, seconds, secondsOf, condFor, cueOf, doSample,
         handoffBefore, resumable = true} = spec;
  const secsAt = i => (secondsOf ? secondsOf(i) : seconds);
  RUN.paused = false; RUN.retry = false; RUN.abort = false; RUN.active = true;
  if (!S.startedAt) { S.startedAt = Date.now(); }
  // A non-resumable block always starts clean: its samples are only real while
  // they are in memory, so persisted progress from a previous attempt describes
  // audio that no longer exists.
  if (!resumable) { S.blocks[id] = {done:0}; save(); }
  let i = (S.blocks[id] || {}).done || 0;
  const started = i;
  let handoffShownFor = -1;

  while (i < count) {
    const cond = condFor ? condFor(i) : null;
    const cue = cueOf ? cueOf(i) : "";
    const ctx = {who, title, cue, condition:cond, blockDone:i, blockTotal:count};
    await waitWhilePaused(ctx);
    if (RUN.abort) break;

    // A different human takes over here. Wait for a deliberate Continue — the
    // countdown must not start while the previous speaker is still sitting
    // there. Shown once per index, so a retry does not re-ask.
    if (handoffBefore && handoffShownFor !== i) {
      const h = handoffBefore(i);
      if (h) { await handoff(h.title, h.body, h.cta); }
      handoffShownFor = i;
      if (RUN.abort) break;
    }

    // Countdown: a full 3-2-1 at the top of a block, one beat between samples.
    const lead = (i === started) ? LEAD_IN_S : LEAD_NEXT_S;
    for (let n = lead; n > 0; n--) {
      stageRender({...ctx, big:String(n), state:"get ready"});
      await sleep(1000);
      if (RUN.abort) break;
    }
    if (RUN.abort) break;

    const t0 = Date.now();
    stageRender({...ctx, big:"●", state:'<span class="bad">RECORDING</span>', hot:true});
    RUN.retry = false;
    const blob = await record(secsAt(i) * 1000);

    if (RUN.retry) {                       // a cough, an interruption, a bad take
      RUN.retry = false;
      stageRender({...ctx, state:'<span class="warn">discarded — recording again</span>'});
      await sleep(500);
      continue;                            // SAME index
    }

    stageRender({...ctx, state:"processing…"});
    let outcome = "error", detail = "", result = null;
    try {
      const ok = await doSample(blob, i, cond, cue);
      outcome = (ok === false) ? "error" : "ok";
      result = (ok && typeof ok === "object") ? ok : null;
      if (result && result.note) detail = result.note;
    } catch (e) {
      detail = e.message || String(e);
      // POST-DISPATCH failure. The backend may already have committed the turn,
      // so this block's conversation can no longer be called clean. Retrying
      // the sample would build the rest of the run on top of it. Abort instead;
      // the next explicit invocation mints a fresh conversation and starts over.
      if (e && e.postChat) {
        RUN.abort = true;
        RUN.aborted_reason = detail;
        stageRender({...ctx, state:
          `<span class="bad">aborted: ${detail}</span><br>`
          + `<span class="dim">The backend may already have recorded that turn, so `
          + `this conversation is no longer clean. Run step 9 again — it will use `
          + `a new conversation.</span>`});
        await sleep(2500);
        break;
      }
    }

    if (outcome !== "ok") {
      stageRender({...ctx, state:`<span class="bad">sample failed: ${detail}</span>
        <br><span class="dim">retrying this same sample — nothing was counted</span>`});
      await sleep(1600);
      continue;                            // SAME index. Never skipped.
    }

    // ONE state transition, ONE save. The row and the advanced index become
    // durable together, so a reload can never find a stored row with the block
    // index still behind it — which would re-record that index and double-count
    // the trial.
    i = advance(i, "ok");
    commitSample(S, {blockId:id, nextIndex:i,
                     row: result ? result.row : null,
                     store: result ? result.store : null});
    S.paceMs = (S.paceMs||[]).concat(Date.now() - t0).slice(-40);
    save();
    stageRender({...ctx, blockDone:i,
      state:`<span class="ok">✓ captured</span> ${detail ? '<span class="dim">'+detail+'</span>' : ""}`});
    if (i < count) await sleep(GAP_MS);
  }

  RUN.active = false;
  stageHide();
  return i >= count;
}

// ── per-sample processors ───────────────────────────────────────────────────

async function identify(blob) {
  const fd = new FormData();
  fd.append("file", blob, "trial.webm");
  const t0 = performance.now();
  const out = await api("/speaker/identify", {method:"POST", body:fd});
  out.round_trip_ms = Math.round(performance.now() - t0);
  // NOT "embed_ms": the server times the whole identify() call — quality gate,
  // embedding and scoring. Naming it embedding-only would overstate it.
  out.identify_ms = out.embed_ms;
  return out;
}

/** Build the trial row. Deliberately does NOT store or save it: `runBlock`
 *  commits the row and the block index together, in one save. */
function buildTrialRow(out, {truthId, truthName, phase, condition, block}) {
  S.latency.push({identify_ms: out.identify_ms, round_trip_ms: out.round_trip_ms});
  const row = {
    truth: truthId, truthName, block, phase, condition,
    // TWO DIFFERENT THINGS, kept apart:
    //   predicted_profile_id  the ASSERTED identity, null unless `known`.
    //                         The confusion matrix uses this and only this.
    //   top_profile_id        who merely RANKED FIRST, set even for unknown.
    //                         Calibration fits on this.
    predicted_profile_id: out.profile_id || null,
    predictedName: out.display_name || null,
    top_profile_id: out.top_scored_profile_id ?? null,
    topName: out.top_scored_display_name ?? null,
    top_score: out.similarity ?? 0,
    second_score: out.second_best_similarity ?? null,
    second_profile_id: out.second_best_profile_id ?? null,
    status: out.status || "", threshold: out.threshold ?? null,
  };
  // Validation is stored SEPARATELY from calibration. The fit must never see
  // the audio it will later be judged against — `storeFor` decides which array
  // `commitSample` pushes into.
  return {row, store: storeFor(phase)};
}

async function enrolBatch(name, role, key, blocks) {
  const fd = new FormData();
  fd.append("display_name", name);
  fd.append("role", role);
  blocks.forEach((b,i) => fd.append("files", b, `s${i}.webm`));
  const out = await api("/speaker/enroll", {method:"POST", body:fd});
  S.enroll[key] = out;
  if (key === "marcus") S.marcusId = out.profile_id; else S.guestId = out.profile_id;
  save();
  return out;
}

// ── the live production pipeline: /stt -> voice_turn_id -> /chat ────────────
// Takes an already-recorded blob, because the batch engine owns recording. The
// memory sentinel is the ONLY caller: it is the one check that has to prove
// attribution through the real turn path, not just the classifier.
// SPLIT ON PURPOSE. The old chatTurn() ran /stt and immediately /chat, so an
// unparseable STORE transcript had ALREADY entered the conversation before
// extractCanary rejected it — and the retry then left that rejected turn
// sitting in the supposedly clean conversation.
//
// Now every validation happens between the two calls: transcribe once, decide,
// and only then redeem THAT handle with THAT text.
async function sttTurn(blob) {
  const fd = new FormData();
  fd.append("file", blob, "cmd.webm");
  fd.append("speaker", "true");
  const t0 = performance.now();
  const stt = await api("/stt", {method:"POST", body:fd});
  return { text: stt?.text ?? "", speaker: stt?.speaker || null,
           handle: stt?.speaker?.voice_turn_id || null,
           stt_ms: Math.round(performance.now() - t0) };
}

// PostChatError lives in PART 1 beside makeSentinelDoSample, which is what
// raises it for post-dispatch bookkeeping failures.

/** Redeem exactly this /stt result through /chat, once. Never re-transcribes. */
async function chatFromStt(sttResult, convId) {
  let chat;
  try {
    chat = await api("/chat", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ message: sttResult.text || null, attachments: [],
                             input_source: "voice",
                             ...(convId ? {conversation_id: convId} : {}),
                             ...(sttResult.handle ? {voice_turn_id: sttResult.handle} : {}) })});
  } catch (e) {
    throw PostChatError(`/chat failed after dispatch: ${e.message}`);
  }
  return { text: sttResult.text, speaker: sttResult.speaker, handle: sttResult.handle,
           reply: chat?.assistant ?? chat?.response ?? chat?.text ?? "",
           conversation_id: chat?.conversation_id ?? null, stt_ms: sttResult.stt_ms };
}

/** /stt and NOTHING else — for the latency benchmark, which must not have an
 *  LLM turn inside the number, and for the permission probe, which needs an
 *  UNREDEEMED voice_turn_id (a /chat call would spend it). */
async function sttOnly(blob, wantSpeaker) {
  const fd = new FormData();
  fd.append("file", blob, "cmd.webm");
  if (wantSpeaker) fd.append("speaker", "true");
  const t0 = performance.now();
  const stt = await api("/stt", {method:"POST", body:fd});
  return { text: stt.text, speaker: stt.speaker || null,
           stt_ms: Math.round(performance.now() - t0) };
}

// ── composite flows ─────────────────────────────────────────────────────────

// SENTINEL_STEPS and PERMISSION_STEPS live in PART 1: they are pure data, and
// the handoff rule that reads them has to be testable without a browser.

async function sentinelFlow() {
  // A FRESH conversation for EVERY invocation. `if (!S.sentinelConversationId)`
  // meant a step-9 retry reused the abandoned attempt's id — and conversation
  // state lives for seven days, so the old attempt's store turns were still
  // sitting in each speaker's scope. Run 2's replies quoted `guest live 661`,
  // a token from the previous attempt that nobody said during this one. Retries
  // were not independent trials.
  //
  // Minted here, before the first recording, and persisted so the five turns of
  // THIS run share it. Steps 1-8 are untouched by this.
  S.sentinelConversationId = crypto.randomUUID();
  save();
  const CID = S.sentinelConversationId;

  const M_S = SENTINELS.marcus, G_S = SENTINELS.guest;
  // What STT actually decoded for each speaker's store turn — the only thing
  // Nova could possibly have been asked to remember. Filled in during the run.
  const observed = {marcus: null, guest: null};
  const out = { steps: [], conversation_id: CID, conversation_stable: true,
                intended_canary: {marcus: M_S, guest: G_S},
                observed_stt_canary: observed };
  const replies = [];

  // ATOMIC (`resumable:false` below). The five turns accumulate their results
  // in memory, so a reload partway through would resume at turn 4 with no
  // record of turns 1-3 and silently report an incomplete sentinel as complete.
  // Five recordings is a cheap thing to redo; a wrong privacy verdict is not.
  await runBlock({
    id:"sentinel", who:"one turn each — Marcus, guest, then a third voice",
    title:"memory attribution (live pipeline)",
    count:SENTINEL_STEPS.length, resumable:false,
    secondsOf: i => SENTINEL_STEPS[i].secs,
    cueOf: i => SENTINEL_STEPS[i].cue,
    // Four real speaker changes in five turns. Each one waits for a Continue.
    handoffBefore: i => {
      if (!handoffBeforeIndex(SENTINEL_STEPS, i)) return null;
      const next = stepLabel(SENTINEL_STEPS[i]);
      return {title: `Next to speak: ${next}`,
              body: `${stepLabel(SENTINEL_STEPS[i-1])} is done. Hand the microphone `
                  + `over — recording starts after Continue.<br><br>`
                  + `<span class="dim">${SENTINEL_STEPS[i].cue}</span>`,
              cta: `${next} is ready`};
    },
    // The per-sample logic lives in PART 1 with its dependencies injected, so
    // tests can count real /stt and /chat calls rather than reading the source.
    // RAW EVIDENCE (stt_text, assistant_reply, token forms) is recorded there:
    // run 2 reported a memory failure and kept neither, so a transcription
    // mismatch was indistinguishable from a real one without recording it all
    // again. Synthetic tokens and a scripted question; nothing biometric.
    doSample: makeSentinelDoSample(
      {sttTurn, chatFromStt},
      {steps: SENTINEL_STEPS, CID, observed, replies, out}),
  });
  if (out.steps.length < SENTINEL_STEPS.length) return null;   // aborted

  const marcusTurns = out.steps.filter(s => s.who === "Marcus");
  const guestTurns  = out.steps.filter(s => s.who === "Guest");
  const ur = out.steps.find(s => s.who === "unverified") || {};
  out.marcus_recognised = marcusTurns.length > 0
    && marcusTurns.every(s => s.status === "known" && s.profile_id === S.marcusId);
  out.guest_recognised = guestTurns.length > 0
    && guestTurns.every(s => s.status === "known" && s.profile_id === S.guestId);
  out.unverified_status = ur.status ?? null;
  out.unverified_is_unverified = UNVERIFIED_OK.includes(out.unverified_status);
  if (!out.unverified_is_unverified) {
    out.note = `The third speaker came back "${out.unverified_status}". The privacy `
             + "check does NOT pass — re-run it with a genuinely unenrolled person, "
             + "or a real unverified condition.";
  }
  // ONE comparison function for the positive checks and the privacy checks
  // alike. Anything that makes "Marcus got his own" easier to satisfy must
  // make "the guest got Marcus's" easier to DETECT by exactly the same amount.
  // RECOMPUTED, now that BOTH observed canaries exist. The per-step flags
  // recorded during the run were evaluated when the guest's canary might still
  // have been null, so they were vacuous for the earlier turns. Every
  // speaker-visible reply is re-examined against the FINAL canaries.
  out.canaries_parsed = !!(observed.marcus && observed.guest);
  out.visibility = out.steps.map((st, i) => ({
    who: st.who, phase: st.phase,
    sees_marcus: containsSentinel(replies[i], observed.marcus),
    sees_guest: containsSentinel(replies[i], observed.guest),
  }));
  out.steps.forEach((st, i) => {
    st.got_marcus = out.visibility[i].sees_marcus;
    st.got_guest = out.visibility[i].sees_guest;
  });

  // Cross-disclosure on ANY reply, including the two STORE turns — not only
  // the final asks.
  out.store_cross_leak =
       (out.visibility[0] && out.visibility[0].sees_guest)      // Marcus store saw hers
    || (out.visibility[1] && out.visibility[1].sees_marcus);    // Guest store saw his

  // Every check — positive AND privacy — uses the OBSERVED canaries, so the
  // oracle is what production actually received.
  out.marcus_got_own = containsSentinel(replies[2], observed.marcus);
  out.guest_got_own = containsSentinel(replies[3], observed.guest);
  out.guest_got_marcus = containsSentinel(replies[3], observed.marcus);
  // The missing half of the symmetry: Marcus must not receive HERS either.
  out.marcus_got_guest = containsSentinel(replies[2], observed.guest);
  out.unverified_got_either = containsSentinel(replies[4], observed.marcus)
                           || containsSentinel(replies[4], observed.guest);
  out.sentinels = {marcus: M_S, guest: G_S};
  out.evidence_revision = STEP9_EVIDENCE_REVISION;
  out.centroids = compatibleIds((S.statusAfter || {}).profiles_detail || []);
  out.comparison = "canonical uppercase alphanumeric tokens, consecutive match; "
                 + "no fuzzy or edit-distance matching; same rule for positive "
                 + "and privacy checks";
  out.pass = out.conversation_stable && out.canaries_parsed
             && out.marcus_recognised && out.guest_recognised
             && out.unverified_is_unverified
             && out.marcus_got_own && out.guest_got_own
             && !out.marcus_got_guest && !out.guest_got_marcus
             && !out.unverified_got_either && !out.store_cross_leak;
  return out;
}

async function permissionFlow() {
  // computer.type — a STANDARD-tier PRODUCTION actuator, not a data-routing
  // call. Safe because guarded mode answers needs_confirmation, the probe
  // rejects its own request immediately, execution is off, and no adapter ships.
  const CAP = "computer.type";
  const typed = await api("/speaker/permission-probe", {method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({capability: CAP})});

  const voices = [];
  const who = [{label:"Marcus", id:S.marcusId}, {label:"Guest", id:S.guestId}];
  const done = await runBlock({   // resumable:false — atomic, as for the sentinel
    id:"permission", who:"Marcus, then the guest", title:"permission probe",
    count:2, seconds:DUR.permission, resumable:false,
    cueOf: i => `${who[i].label}: say any short sentence.`,
    handoffBefore: i => {
      const next = handoffBeforeIndex(PERMISSION_STEPS, i);
      return next ? {title: `Next to speak: ${next}`,
                     body: "Marcus is done. Hand over — recording starts after Continue.",
                     cta: `${next} is ready`} : null;
    },
    doSample: async (blob, i) => {
      const spk = await sttOnly(blob, true);
      const r = await api("/speaker/permission-probe", {method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({capability: CAP,
                              voice_turn_id: spk?.speaker?.voice_turn_id ?? null})});
      voices[i] = { label: who[i].label, expected_profile_id: who[i].id,
                    identity: r.identity, tier: r.tier, mode: r.mode,
                    decision: r.decision, executed: r.executed,
                    recognised: r.identity?.status === "known"
                             && r.identity?.profile_id === who[i].id };
      return {note: `${who[i].label}: ${r.decision}`};
    },
  });
  if (!done) return null;

  const [marcus, guest] = voices;
  const sameDecision = marcus.decision === typed.decision && guest.decision === typed.decision;
  const sameTier = marcus.tier === typed.tier && guest.tier === typed.tier;
  const nothingRan = !typed.executed && !marcus.executed && !guest.executed;
  return {
    capability: CAP, mode: typed.mode, tier: typed.tier,
    typed_reference: {decision: typed.decision, tier: typed.tier,
                      identity: typed.identity, executed: typed.executed},
    marcus, guest,
    both_recognised: marcus.recognised && guest.recognised,
    same_decision: sameDecision, same_tier: sameTier, nothing_executed: nothingRan,
    execution_enabled: typed.execution_enabled, adapter_installed: typed.adapter_installed,
    centroids: compatibleIds((S.statusAfter || {}).profiles_detail || []),
    pass: sameDecision && sameTier && nothingRan && marcus.recognised && guest.recognised,
    note: "PermissionBroker.evaluate() takes no identity argument. Measured, not "
        + "asserted: all three decisions are compared to the typed reference.",
  };
}

async function sttLatencyFlow() {
  // 6 OFF + 6 ON, both at the SAME window length, both /stt-only. Speaker-ON
  // /stt timings do exist elsewhere in this session (the sentinel turns), but
  // those recordings are 4-5s and /stt time scales with audio length through
  // Whisper — pooling them against a 2.5s OFF control would bias the delta.
  // Unlike inputs are not a control, so they are not reused.
  // Persisted, so a reload resumes rather than re-recording twelve samples.
  // Index-aligned with S.blocks.latency.done, so nothing is double-counted.
  if (!S.latencySamples) S.latencySamples = {off:[], on:[]};
  const off = S.latencySamples.off, on = S.latencySamples.on;
  const done = await runBlock({
    id:"latency", who:"either person", title:"/stt latency — OFF then ON",
    count:12, seconds:DUR.latency,
    cueOf: i => (i < 6 ? `Speaker OFF ${i+1}/6 — say a short sentence.`
                       : `Speaker ON ${i-5}/6 — say a short sentence.`),
    doSample: async (blob, i) => {
      const r = await sttOnly(blob, i >= 6);
      (i < 6 ? off : on).push(r.stt_ms);
      S.latencySamples = {off, on};
      return {note: `${r.stt_ms} ms`};
    },
  });
  if (!done) return null;
  return { stt_off_p50: pct(off,.5), stt_off_p95: pct(off,.95),
           stt_on_p50: pct(on,.5),  stt_on_p95: pct(on,.95),
           delta_p50: pct(on,.5) - pct(off,.5),
           delta_p95: pct(on,.95) - pct(off,.95),
           n_off: off.length, n_on: on.length,
           window_s: DUR.latency, path: "/stt only, no /chat",
           reuse_note: "speaker-ON samples were recorded fresh at the same window "
                     + "length as the OFF control; longer sentinel recordings were "
                     + "NOT pooled in, because /stt scales with audio length" };
}

// ── steps UI ────────────────────────────────────────────────────────────────
function stepCard(n, title, active, done, body) {
  const c = el("div", "card step " + (active ? "active" : done ? "done" : ""));
  c.appendChild(el("h2", null, `${n}. ${title} ${done ? '<span class="ok">✓</span>' : ""}`));
  if (typeof body === "string") c.appendChild(el("div", null, body));
  else if (body) c.appendChild(body);
  return c;
}

function blockStatus(id, count) {
  const d = (S.blocks[id]||{}).done || 0;
  if (d === 0) return el("div","dim",`0 / ${count} recorded`);
  return el("div", d >= count ? "ok" : "warn",
    d >= count ? `${d} / ${count} recorded ✓` : `${d} / ${count} recorded — resume to finish`);
}

function trialTable(rows) {
  if (!rows.length) return el("div", "dim", "No trials yet.");
  const t = el("table");
  // `said` is what Nova ASSERTED; `top` is only the ranking. They differ on
  // every honest rejection, and seeing both is how a human spots a run where
  // recognition is fine but the threshold is mis-set.
  t.innerHTML = "<tr><th>#</th><th>truth</th><th>cond</th><th>status</th>"
              + "<th>said</th><th>top</th><th>score</th><th>2nd</th><th>thr</th></tr>";
  rows.slice(-8).forEach((r,i) => {
    const tr = el("tr");
    tr.innerHTML = `<td>${rows.length-Math.min(8,rows.length)+i+1}</td><td>${r.truthName||r.truth}</td>`
      + `<td>${r.condition}</td><td>${r.status}</td>`
      + `<td>${r.predictedName||"<span class='dim'>—</span>"}</td><td>${r.topName||"-"}</td>`
      + `<td>${(r.top_score??0).toFixed(3)}</td>`
      + `<td>${r.second_score==null?"-":r.second_score.toFixed(3)}</td>`
      + `<td>${r.threshold==null?"-":r.threshold.toFixed(2)}</td>`;
    t.appendChild(tr);
  });
  return t;
}

function trialPayload(t) {
  return {truth:t.truth, top_profile_id:t.top_profile_id, top_score:t.top_score,
          second_score:t.second_score, second_profile_id:t.second_profile_id,
          status:t.status, condition:t.condition, phase:t.phase};
}

async function runEnrollBlock(key, name, role, id, stepAfter) {
  // The six clips exist ONLY in this array, and audio is never persisted. So
  // this block is non-resumable: any interruption before the upload succeeds
  // means the recordings are gone and all six must be re-taken. `resumable:
  // false` makes runBlock start from 0 and ignore any stale progress.
  const kept = [];
  const ok = await runBlock({
    id, who:name, title:"enrollment — read each phrase aloud", count:6,
    seconds:DUR.enroll, resumable:false,
    cueOf: i => ENROLL_PHRASES[i],
    doSample: async (blob) => { kept.push(blob); return {note:"held for upload"}; },
  });
  if (!ok || kept.length < 6) {
    // Stopped part-way. Do not leave progress claiming samples that no longer
    // exist anywhere.
    S.blocks[id] = {done:0}; save();
    alertBanner(`${name}'s enrollment was interrupted at ${kept.length} of 6. `
      + "Enrollment clips are held in memory and never written to disk, so those "
      + "recordings are gone — <b>all six must be recorded again</b>.");
    return false;
  }
  stageShow(`<div class="who">${name}</div><div class="cue">Enrolling…</div>
             <div class="state dim">Uploading 6 samples; audio is discarded after embedding.</div>`);
  let out;
  try { out = await enrolBatch(name, role, key, kept); }
  catch (e) { out = {ok:false, error: e.message || String(e)}; }
  stageHide();

  if (!out.ok) {
    S.blocks[id] = {done:0}; save();
    alertBanner(`Enrollment failed: ${out.error||"unknown"}. All six clips must be re-recorded.`);
    return false;
  }
  if (!out.meets_p52_bar) {
    // The SERVER may already hold a profile built from too few kept samples.
    // Do not advance, and do not quietly delete it either — deleting a profile
    // is the human's explicit decision, in preflight.
    S.blocks[id] = {done:0}; save();
    alertBanner(
      `<b>${name}'s enrollment is below the P5.2 bar</b>: only ${out.sample_count} of 6 `
      + `samples survived the quality gate (5 required). ${out.note||""}<br>`
      + `A profile <code>${out.profile_id}</code> WAS created on the backend. Re-record `
      + "the enrollment, or delete that profile from Preflight first — the harness "
      + "will not proceed with a sub-P5.2 enrollment.");
    return false;
  }
  S.step = stepAfter; save();
  return true;
}

/**
 * Fetch /speaker/status, persist it, and refuse to proceed unless the
 * CALIBRATED policy is the one actually deciding.
 *
 * Needed for RESUMED sessions above all: Marcus applied calibration under an
 * older harness, so the post-Apply check never ran for him. Without this, a run
 * could spend steps 8-11 validating an env override.
 *
 * Runs BEFORE any microphone access or state mutation, so a block costs nothing.
 */
async function policyPreflight(what, opts) {
  opts = opts || {};
  let st, pr;
  try {
    st = await api("/speaker/status");
    pr = await api("/speaker/profiles");
  }
  catch (e) {
    alertBanner(`Could not reach the backend before ${what}: ${e.message}`);
    return false;
  }
  S.statusAfter = st; save();

  // LINEAGE FIRST. Adding the guest at step 5 is the designed progression and
  // invalidates nothing; a centroid DISAPPEARING invalidates exactly what was
  // scored against it.
  const curIds = compatibleIds(pr.profiles);
  const stale = staleLineage(S, curIds, buildOf(st));
  if (stale.length) {
    alertBanner(
      `<b>${what} blocked — evidence was scored against centroids that no longer `
      + `exist.</b><br>`
      + `Current compatible profiles: <code>${curIds.join(", ") || "none"}</code><br>`
      + stale.map(s => `<code>${s.block}</code>: ${s.why}`).join("<br>")
      + `<br><br>Those scores cannot be relabelled onto the profiles enrolled `
      + `now. <b>Reset and run a single clean calibration</b> — nothing was `
      + `recorded or changed just now.`);
    return false;
  }
  if (opts.generationOnly) return true;
  if (calibratedPolicyStatus(st)) return true;
  alertBanner(
    `<b>${what} blocked — the effective policy is not the calibrated one.</b><br>`
    + `${policyProblem(st)}.<br>`
    + `Nothing was recorded and nothing was cleared. Unset `
    + `<code>NOVA_SPEAKER_THRESHOLD</code> / <code>NOVA_SPEAKER_MARGIN</code>, `
    + `restart the backend, press <b>Check</b> to confirm both sources read `
    + `"calibrated", then try again.`);
  return false;
}

function alertBanner(msg) {
  const b = el("div","banner"); b.innerHTML = `<h3 class="bad">Problem</h3><div>${msg}</div>`;
  $("#steps").prepend(b);
  setTimeout(() => b.remove(), 9000);
}

async function runTrialBlock({id, truthId, truthName, phase, count, pool, stepAfter, handoffTitle, handoffBody}) {
  // Which centroids will THIS block's scores be measured against? Profiles AND
  // build come from ONE fresh backend read — deriving a fingerprint from fresh
  // profiles plus a stale cached status would describe neither.
  let curIds = [], build = "";
  try {
    const pr = await api("/speaker/profiles");
